{{คําอธิบายสั้น|มาตรฐานสากลสําหรับรหัสสามตัวอักษรที่ระบุภาษา}}
{{ใช้ dmy dates|date=October 2024}}
'''ISO 639-3:2007''', ''''รหัสสําหรับการแสดงชื่อของภาษา&nbsp;– ส่วนที่ 3: รหัส Alpha-3 สําหรับการครอบคลุมภาษาอย่างครอบคลุม'''' เป็นมาตรฐานสากล สําหรับ [[รหัสภาษา]] ในซีรีส์ [[ISO 639]] กําหนดรหัสสามตัวอักษรเพื่อระบุภาษา มาตรฐานนี้เผยแพร่โดย [[องค์การระหว่างประเทศเพื่อการมาตรฐาน]] (ISO) เมื่อวันที่ 1 กุมภาพันธ์ พ.ศ.2550 <ref name="สถานะ ISO">{{Cite web |title=ISO 639-3:ประกาศเพิกถอนปี 2550 |url=https://www.iso.org/standard/39534.html |publisher=International Organisation for Standardization |date=1 กุมภาพันธ์ 2550 |access-date=6 มิถุนายน 2568 |archive-url=https://web.archive.org/web/20240606000000/https://www.iso.org/standard/39534.html |archive-date=6 มิถุนายน 2567 |url-status=live}}</อ้างอิง>

ในปี 2023 มาตรฐานฉบับนี้ได้ถูกเพิกถอนอย่างเป็นทางการและแทนที่ด้วย ISO 639:2023<ref name="สถานะ ISO" />

ISO 639-3 ขยายรหัส [[ISO 639-2]] alpha-3 โดยมีเป้าหมายเพื่อให้ครอบคลุม [[ภาษาธรรมชาติ]] ที่รู้จักทั้งหมด ความครอบคลุมของภาษาที่ขยายออกไปนั้นขึ้นอยู่กับรหัสภาษาที่ใช้ใน ''[[Ethnologue]]'' (เล่ม 10–14) ที่เผยแพร่โดย [[SIL International]] ซึ่งปัจจุบันเป็น [[หน่วยงานจดทะเบียน]] สําหรับ ISO 639- 3<ref>{{Cite web |title=Maintenance agency and register Authorities |url=http://www.iso.org/iso/home/standards_development/list_of_iso_technical_committees/maintenance_agencies.htm |publisher=ISO |access-date=12 มกราคม 2014 |archive-date=8 ตุลาคม 2012 |archive-url=https://web.archive.org/web/20121008180204/http://www.iso.org/iso/home/standards_development/list_of_iso_technical_committees/maintenance_agencies.htm |url-status=live }}</ref> ให้การแจงนับภาษาให้ครบถ้วนที่สุด รวมถึงสิ่งมีชีวิตและสูญพันธุ์ โบราณและก่อสร้าง ใหญ่และรอง เขียนและไม่ได้เขียน <ref name="สถานะ ISO" /> อย่างไรก็ตาม ไม่รวมถึง [[ภาษาที่สร้างขึ้นใหม่]] เช่น [[ภาษาโปรโต-อินโด-ยูโรเปียน|โปรโต-อินโด-ยูโรเปียน]]<ref>{{Cite web |title=Types of dividual languages – Ancient languages |url=https://iso639-3.sil.org/about/types#Ancient |access-date=2018-06-11 |website=SIL International |archive-date=12 มิถุนายน 2018 |archive-url=https://web.archive.org/web/20180612140613/https://iso639-3.sil.org/about/types#Ancient |url-สถานะ=สด }}</อ้างอิง>

ISO 639-3 มีไว้สําหรับใช้เป็นรหัส [[ข้อมูลเมตา]] ในการใช้งานที่หลากหลาย มีการใช้กันอย่างแพร่หลายในระบบคอมพิวเตอร์และข้อมูล เช่น อินเทอร์เน็ต ซึ่งจําเป็นต้องรองรับหลายภาษา ในเอกสารสําคัญและการจัดเก็บข้อมูลอื่นๆ จะใช้ในระบบแค็ตตาล็อก โดยระบุว่าทรัพยากรอยู่ในหรือเกี่ยวกับภาษาใด รหัสนี้ยังใช้บ่อยในวรรณกรรมทางภาษาศาสตร์และที่อื่นๆ เพื่อชดเชยความจริงที่ว่าชื่อภาษาอาจไม่ชัดเจนหรือคลุมเครือ

