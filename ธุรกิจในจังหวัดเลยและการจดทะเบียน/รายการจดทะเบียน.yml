'''Lalamove''' (known as '''Huolala''' in Mainland China) is a logistics and delivery platform operating across Asia, the Americas, and EMEA.<ref name="bridgeround">{{cite news |last=Shu |first=Catherine |date=9 September 2015 |title=On-Demand Logistics Startup Lalamove Lands $10M To Fuel Its China Expansion |url=https://techcrunch.com/2015/09/09/on-demand-logistics-startup-lalamove-scores-10m-to-fuel-its-china-expansion/ |work=[[TechCrunch]] |access-date=16 February 2019 }}</ref> Founded in Hong Kong in 2013 as '''EasyVan''', the company rebranded in 2014 and connects users with delivery partners via mobile and web applications. As of 2025, it operates in over 400 cities across 17 markets, including China, Southeast Asia, Brazil, Mexico, and Turkey. Its parent company, '''Lalatech Holdings''', is the world's largest logistics transaction platform by closed-loop freight gross transaction value (GTV).<ref>{{Cite web |title=Share sale on the move again |url=https://www.thestandard.com.hk/finance/article/58162/Share-sale-on-the-move-again |access-date=2026-05-13 |website=www.thestandard.com.hk |language=en}}</ref>

==History==
'''Founding and early growth'''

Lalamove was founded in Hong Kong in December 2013 by Chow Shing-Yuk. Initially launched as EasyVan, the platform was designed to digitize the traditional van-hailing industry by connecting users directly with drivers for moving and logistics services. In 2014, the company rebranded to Lalamove<ref>{{cite web |url=https://www.techinasia.com/hong-kongs-easyvan-rebrands-as-lalamove-just-in-time-for-launch-in-bangkok |title=Hong Kon's Easyvan rebrands as Lalamove just in time for launch in Bangkok |last=Horwitz |first=Josh |date=27 November 2014 |website=www.techinasia.com |publisher=[[Tech in Asia]]}}</ref> to support its international expansion strategy. By 2015, the service had expanded beyond its home market into Singapore, Taipei, and Bangkok.

'''Regional expansion and service evolution'''

Between 2016 and 2019, Lalamove entered the Philippine and Vietnamese markets.<ref>{{cite news |last1=Leung |first1=Hannah |date=10 October 2017 |title=Lalamove Scores $100M Investment From China: Is This Hong Kong's Next Unicorn? |url=https://www.forbes.com/sites/hannahleung/2017/10/10/lalamove-scores-100m-investment-from-china-is-this-hong-kongs-next-unicorn/ |access-date=16 February 2019 |work=[[Forbes]] |language=en}}</ref> In 2019, it expanded outside of Asia for the first time, launching operations in Latin America, including Brazil and Mexico. By 2025, the company further extended its reach to Bangladesh and the EMEA region, including Turkey, the UAE, and Germany.<ref>{{Cite news |title=Lalamove launches in Bangladesh |url=https://www.thedailystar.net/tech-startup/news/lalamove-launches-bangladesh-3104301%3famp |work=The Daily Star}}</ref><ref>{{Cite news |title=Delivery platform Lalamove launches in Bangladesh |url=https://www.dhakatribune.com/business/2022/08/25/delivery-platform-lalamove-launches-in-bangladesh |work=Dhaka Tribune}}</ref> Alongside this geographic growth, the platform diversified its services, introducing ride-hailing in Southeast Asia and Indonesia in 2024. In June 2025, the company expanded into the electric vehicle (EV) sector with the launch of its new energy vehicle brand, "DuoLa Auto," and the introduction of the [[DuoLa Bafang]] microvan.<ref>{{Cite web|title=Logistics giant Lalamove unveils electric cargo van|url=https://carnewschina.com/2025/06/19/logistics-giant-lalamove-unveils-electric-cargo-van/|access-date=2025-11-13|website=carnewschina.com}}</ref>

'''Funding and market scale'''

Lalamove has secured significant venture capital to support its global operations. The company achieved "unicorn" status in 2019 following a US$300 million Series D funding round,<ref>{{cite web |last=Ellis |first=Jack |date=21 February 2019 |title=Lalamove hauls in $300m from Sequoia China and Hillhouse, plans vehicle leasing biz |url=https://www.techinasia.com/lalamove-hauls-300m-sequoia-hillhouseled |access-date=22 May 2020 |website=www.techinasia.com |publisher=[[Tech in Asia]]}}</ref> with its valuation later reaching approximately US$1 billion after a US$1.5 billion Series F round in 2021. As of late 2024, the platform reported a presence in over 400 cities globally, maintaining a monthly active merchant base of approximately 1670 million and 170 million active drivers.<ref>{{Cite web |date=2025-05-06 |title=Lalamove盧家培：香港創科有得搞 |url=https://www.stheadline.com/daily-finance/3452938/Lalamove%E7%9B%A7%E5%AE%B6%E5%9F%B9%E9%A6%99%E6%B8%AF%E5%89%B5%E7%A7%91%E6%9C%89%E5%BE%97%E6%90%9E |access-date=2026-05-13 |website=星島頭條 |language=zh-HK}}</ref>

== Corporate affairs ==

=== Subsidiaries and Brands ===
Huolala: The primary brand operating in Mainland China.

Lalamove: The brand operating in Hong Kong, Southeast Asia, the Americas, and EMEA.

Lalatech: The holding company for the group’s global operations.

=== Corporate Social Responsibility (CSR) ===
Lalamove operates several social initiatives, often under its "Deliver Care" program.<ref>{{Cite web |date=2020-06-01 |title=Lalamove reveals details of Asia-wide COVID-19 relief CSR programme |url=https://www.marketing-interactive.com/lalamove-reveals-details-of-asia-wide-covid-19-relief-csr-programme |access-date=2026-05-13 |website=Marketing-Interactive |language=en}}</ref><ref>{{Cite web |title=Brand-side reactions to the coronavirus crisis in Asia |url=https://www.campaignasia.com/article/brand-side-reactions-to-the-coronavirus-crisis-in-asia/458053}}</ref> In the Philippines, the company introduced the '''"LalaJeep"''' service in [[Quezon City]] to assist [[jeepney]] drivers affected by the COVID-19 pandemic in transitioning to delivery operations.<ref>{{Cite web |date=2020-06-26 |title=Lalamove and QC local government launch LalaJeep |url=https://businessmirror.com.ph/2020/06/26/lalamove-and-qc-local-government-launch-lalajeep/ |access-date=2026-05-13 |website=BusinessMirror |language=en-US}}</ref>

=== Sustainability and Governance ===
In 2022, Lalamove released its inaugural Sustainability Report, which outlined the company’s framework for integrating Environmental, Social, and Governance (ESG) factors into its operational planning.<ref>{{Cite web |date=2023-02-20 |title=Lalamove：內地去年首7月新能源車稱霸租車業務 |url=https://www.stheadline.com/esg/3200898/Lalamove%E5%85%A7%E5%9C%B0%E5%8E%BB%E5%B9%B4%E9%A6%967%E6%9C%88%E6%96%B0%E8%83%BD%E6%BA%90%E8%BB%8A%E7%A8%B1%E9%9C%B8%E7%A7%9F%E8%BB%8A%E6%A5%AD%E5%8B%99 |access-date=2026-05-13 |website=星島頭條 |language=zh-HK}}</ref>

=== Regional Initiatives ===
Animal Welfare: In 2023, the company launched the "Makes a Pawfect Move" campaign across Asia and Latin America to provide logistics support for pet rescue organizations.<ref>{{Cite web |last=am730 |date=2023-10-10 |title=守護毛孩丨Lalamove推「毛Lala有頭家」 鼓勵Lala積分換愛心 捐助毛孩團體 |url=https://www.am730.com.hk/%E7%94%9F%E6%B4%BB/404549/%E5%AE%88%E8%AD%B7%E6%AF%9B%E5%AD%A9%E4%B8%A8lalamove%E6%8E%A8-%E6%AF%9Blala%E6%9C%89%E9%A0%AD%E5%AE%B6-%E9%BC%93%E5%8B%B5lala%E7%A9%8D%E5%88%86%E6%8F%9B%E6%84%9B%E5%BF%83-%E6%8D%90%E5%8A%A9%E6%AF%9B%E5%AD%A9%E5%9C%98%E9%AB%94 |access-date=2026-05-13 |website=am730 |language=zh-HK}}</ref>

Community Health: In 2025, the company organized health screenings for female driver-partners under the "Lalamove Sends Love to Mom" initiative and launched "ElderCare on the MOVE" to support elderly communities across its Asian markets.<ref>{{Cite web |title=ElderCare on the MOVE {{!}} Lalamove SG |url=https://www.lalamove.com/en-sg/eldercare-on-the-move |access-date=2026-05-13 |website=Lalamove |language=en-sg}}</ref>

=== Disaster Relief and Humanitarian Aid ===
Earthquake Relief (2025): Following a 7.7 magnitude earthquake in Myanmar on March 28, 2025, Lalamove coordinated the delivery of relief supplies to victims treated at Rajavithi Hospital in Bangkok, Thailand.<ref>{{Cite web |last=thaipr.net |date=2025-04-02 |title=Lalamove supports earthquake relief efforts with donations to Rajavithi Hospital and 30% off essential deliveries using code "LALAHELP" |url=https://www.thaipr.net/en/logistics_en/3584669 |access-date=2026-05-13 |website=ThaiPR.NET |language=en-US}}</ref>

Brazil (2025): Partnered with local organizations to distribute over 6,000 essential items to homeless populations.<ref>{{Cite web |last=CAMARGO |first=RAUL P. |date=2025-08-25 |title=Lalamove e Entrega por SP se unem para levar mais de 6 mil itens a pessoas em situação de rua no Dia do… |url=https://jornaldobras.com.br/noticia/85075/lalamove-e-entrega-por-sp-se-unem-para-levar-mais-de-6-mil-itens-a-pessoas-em-situacao-de-rua-no-dia-do-voluntariado |access-date=2026-05-13 |website=Jornal do Brás - A serviço das tradições da região! |language=pt-br}}</ref>

Hong Kong (2025): Following a five-alarm fire at Wang Fuk Court in Tai Po on November 26, 2025, the company donated HK$6 million to the HKSAR Government’s "Tai Po Wang Fuk Court Relief Fund."<ref>{{Cite web |title=Lalamove donated 6 million yuan and provided free delivery services to support residents affected by the Tai Po fire |url=https://longbridge.com/en/news/267765123 |access-date=2026-05-13 |website=Lalamove donated 6 million yuan and provided free delivery services to support residents affected by the Tai Po fire |language=en}}</ref>

=== Local Initiatives ===
Education Support: '''Philippines''' (2023): Established the "BiyahEdukasyon" program, providing educational assistance to the families of 100 partner drivers.<ref>{{Cite web |date=2023-09-28 |title=Lalamove Philippines supports the education of 100 partner drivers' families through the 'BiyahEdukasyon' assistance program |url=https://gadaboutprincess.com/lalamove-philippines-supports-the-education-of-100-partner-drivers-families-through-the-biyahedukasyon-assistance-program/ |access-date=2026-05-13 |website=GadAboutPrincess.com |language=en}}</ref>

'''Thailand:''' The company organizes health screening events specifically tailored for female driver partners.<ref>{{Cite web |last=Admin2 |date=2025-08-18 |title=ลาลามูฟจัดกิจกรรม “ลาลามูฟ ส่งรักให้แม่” ตรวจสุขภาพฟรี แทนความห่วงใยสู่พาร์ทเนอร์คนขับหญิง |url=https://www.thailandmovement.com/?p=32732 |access-date=2026-05-13 |website=ThailandMOVEment |language=th}}</ref>

'''Malaysia:''' Under the "Kita move bersama" initiative, Lalamove collaborated with local design brands, such as Yellobanana and Montigo, to produce merchandise aimed at fostering community engagement between drivers and users.<ref>{{Cite web |date=2025-08-13 |title=Lalamove and Yellobanana spotlight Malaysia's movers in colourful merch drop |url=https://www.marketing-interactive.com/lalamove-and-yellobanana-spotlight-malaysia-s-movers-in-colourful-merch-drop |access-date=2026-05-13 |website=Marketing-Interactive |language=en}}</ref>

'''Indonesia:''' To mark National Children's Day, the company hosted the "Driving Dreams" (駕馭夢想) drawing competition for the children of its driver partners and the general public.<ref>{{Cite web |last=Redaksi |first=Tim |date=2024-07-30 |title=Lalamove Merayakan Hari Anak Nasional Melalui “Driving Dreams Drawing Competition” |url=https://www.indonesianjournal.id/lalamove-merayakan-hari-anak-nasional-melalui-driving-dreams-drawing-competition/ |access-date=2026-05-13 |website=Indonesian Journal |language=en-US}}</ref>

'''Hong Kong:''' Through the "LALA Move for Seniors" (LALA聲送暖耆妙行) program, the company partners with local non-profit organizations to provide logistics and delivery support for essential supplies to the elderly.<ref>{{Cite web |last=am730 |date=2025-05-29 |title=洞悉樂齡科技 經營代步輪椅 天天代步創辦人Angus：收送物流麻煩 易有拗撬 全靠Lalamove力撐 實現二手輪椅平台 成本價轉贈需要人士 |url=https://www.am730.com.hk/%E6%9C%AC%E5%9C%B0/563545/%E6%B4%9E%E6%82%89%E6%A8%82%E9%BD%A1%E7%A7%91%E6%8A%80-%E7%B6%93%E7%87%9F%E4%BB%A3%E6%AD%A5%E8%BC%AA%E6%A4%85-%E5%A4%A9%E5%A4%A9%E4%BB%A3%E6%AD%A5%E5%89%B5%E8%BE%A6%E4%BA%BAangus-%E6%94%B6%E9%80%81%E7%89%A9%E6%B5%81%E9%BA%BB%E7%85%A9-%E6%98%93%E6%9C%89%E6%8B%97%E6%92%AC-%E5%85%A8%E9%9D%A0lalamove%E5%8A%9B%E6%92%90-%E5%AF%A6%E7%8F%BE%E4%BA%8C%E6%89%8B%E8%BC%AA%E6%A4%85%E5%B9%B3%E5%8F%B0-%E6%88%90%E6%9C%AC%E5%83%B9%E8%BD%89%E8%B4%88%E9%9C%80%E8%A6%81%E4%BA%BA%E5%A3%AB |access-date=2026-05-13 |website=am730 |language=zh-HK}}</ref>

== Services ==
'''Freight & Delivery''': The platform matches users with drivers of various vehicles—including motorcycles, cars, vans, and trucks (ranging from 1-ton to large lorries)—for point-to-point delivery.

'''Moving Services''': Specialized logistics for residential and office relocations, which may include driver assistance with loading and unloading.

'''Inter-city Freight''': Long-haul logistics services connecting businesses across different cities.

'''Lalamove Ride''': A ride-hailing service available in select Southeast Asian markets, including the Philippines, Malaysia, Indonesia, and Vietnam.

'''Enterprise Solutions''': API integration services designed for e-commerce businesses to automate delivery scheduling and fulfillment.

'''Vehicle Rental & Sales''': In Mainland China, the company operates a business line for the sale and leasing of vehicles to drivers, with a focus on New Energy Vehicles (NEVs).

'''Fleet Management''': A platform for fleet owners to register and manage multiple vehicles and drivers. The interface provides owners with oversight of daily operational activities and driver performance.

'''Pet Transportation''': A specialized transport service for pets, currently available exclusively in the Hong Kong market.<ref>{{Cite web |title=Lalamove寵物專頁｜寵物Call車、寵物接送、玩樂優惠一篇睇晒｜Lalamove 香港 |url=https://www.lalamove.com/zh-hk/petpetpage |access-date=2026-05-13 |website=Lalamove |language=zh-hk}}</ref>

== Technology ==
The Lalamove platform utilises a proprietary matching algorithm to pair delivery orders with nearby drivers. Features of the application include real-time GPS tracking and a multi-stop delivery function that allows for up to 20 stops per route.

'''Safety Initiatives'''

Following safety incidents in 2021, the application was updated with an integrated "Safety Center" which includes one-touch emergency assistance, in-ride audio recording, and route deviation alerts.

In 2025, Lalamove partnered with the [[Hong Kong Productivity Council]] (HKPC) to implement an AI-Driven Driving Behaviour Prediction System. This system utilizes artificial intelligence to identify and mitigate risky driving patterns to improve road safety.<ref>{{Cite web |date=2025-10-06 |title=Lalamove夥生產力局推「AI駕駛行為預測」首年收費1元 助提高安全性 反對懲罰機制 |url=https://www.stheadline.com/realtime-finance/3505933/Lalamove%E5%A4%A5%E7%94%9F%E7%94%A2%E5%8A%9B%E5%B1%80%E6%8E%A8AI%E9%A7%95%E9%A7%9B%E8%A1%8C%E7%82%BA%E9%A0%90%E6%B8%AC%E9%A6%96%E5%B9%B4%E6%94%B6%E8%B2%BB1%E5%85%83-%E5%8A%A9%E6%8F%90%E9%AB%98%E5%AE%89%E5%85%A8%E6%80%A7-%E5%8F%8D%E5%B0%8D%E6%87%B2%E7%BD%B0%E6%A9%9F%E5%88%B6 |access-date=2026-05-13 |website=星島頭條 |language=zh-HK}}</ref>

'''Ongoing Projects'''

Lalamove is a participant in the Hong Kong government's "Low-Altitude Economy Regulatory Sandbox" project, launched in 2025.<ref>{{Cite web |date=2025-03-21 |title=無人機「監管沙盒」試點項目 當局盼未來服務離島及偏遠地區 |url=https://hk.on.cc/hk/bkn/cnt/news/20250321/bkn-20250321093309172-0321_00822_001.html |access-date=2026-05-13 |website=on.cc東網 |language=zh-hk}}</ref> The initiative involves exploring the use of unmanned aerial vehicles (drones) for logistics and delivery services, particularly for reaching remote areas or offshore islands.<ref>{{Cite web |title=38個低空經濟試點項目獲批　涉及無人機巡查、救援及送藥　部分下月起推行 |url=https://news.mingpao.com/ins/港聞/article/20250320/s00001/1742444551948/38個低空經濟試點項目獲批-涉及無人機巡查-救援及送藥-部分下月起推行}}</ref>

== Award & Recognition ==
Lalamove has received several industry awards for its corporate social responsibility (CSR) initiatives, technological application, and brand presence.

In the area of community impact, the company received the Best Use of CSR Award in 2024 for its "Make A Pawfect Move" campaign.<ref>{{Cite web |date=2024-07-05 |title=The 2024 International CSR Awards Winners - The International CSR Excellence Awards |url=https://csrawards.co.uk/the-2024-international-csr-awards-winners/ |access-date=2026-05-13 |website=csrawards.co.uk |language=en-GB}}</ref> This followed several recognitions in 2023 from the Industry Cares Recognition Scheme, where the company was awarded the Grand Award, The Most Devoted Award, and the Best Social Impact Award.<ref>{{Cite web |title=Industry Cares Recognition Scheme 2023 Presentation Ceremony |url=https://industryhk.org/en/past-events/presentation-ceremony-of-industry-cares-recognition-scheme-2023/}}</ref>

For its technical and digital operations, Lalamove was named Tech Enabler of the Year and Tech Impact Company of the Year at the 2023 Revive Tech Asia Awards.<ref>{{Cite web |last=Taco@Slasher.biz |title=Revive Tech Asia {{!}} Flagship Business Tech Event |url=https://revivetech.asia/spotlights/revive-tech-asia-awards-2023 |access-date=2026-05-13 |website=revivetech.asia |language=en}}</ref> The company’s mobile application received a Silver Award at the 2023 Asia Smart App Awards, organized by the Hong Kong Wireless Technology Industry Association.<ref>{{Cite web |title=Results of the “Asia Smart App Awards 2022/2023” Announced |url=https://hr.asia/media-outreach/results-of-the-asia-smart-app-awards-2022-2023-announced/}}</ref> Additionally, at the 2023 Loyalty & Engagement Awards, the platform's membership program and use of rewards both received Bronze designations.<ref>{{Cite web |title=2023 Winners |url=https://awards.marketing-interactive.com/loyalty-and-engagement-sg/2023/winners/ |access-date=2026-05-13 |website=Loyalty and Engagement Singapore 2026 |language=en-US}}</ref>

The company has also been recognized for its brand and employment practices, winning the Gold Award at the 2024 Putra Aria Brand Awards.<ref>{{Cite web |date=2026-03-25 |title=Lalamove bags third gold at Putra Aria Brand Awards |url=https://www.thestar.com.my/starpicks/2026/03/25/lalamove-bags-third-gold-at-putra-aria-brand-awards |access-date=2026-05-13 |website=The Star |language=en}}</ref> In 2023, Lalamove was named the Winner of Best Employer Brand and was a finalist for the Best Talent Acquisition Team at the Annual LinkedIn Talent Awards.<ref>{{Cite web |title=#lalamove #employerbranding #talentacquisition #talentawards {{!}} Lalamove |url=https://www.linkedin.com/posts/lalamove_lalamove-employerbranding-talentacquisition-activity-7239883010379067392-r8Q6 |access-date=2026-05-13 |website=LinkedIn |language=en}}</ref>

