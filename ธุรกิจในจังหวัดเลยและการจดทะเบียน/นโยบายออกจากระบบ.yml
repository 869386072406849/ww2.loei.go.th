นโยบายการออกจากระบบของพันธมิตรการจัดส่ง
แก้ไขล่าสุดวันที่ 16 กันยายน  2568

 

พันธกิจของ Lalamove คือการทำให้ทุกคนสามารถส่งสินค้าตามความต้องการและภายในวันเดียวกันได้เพียงแค่กดปุ่ม เพื่อให้บรรลุเป้าหมายดังกล่าว เราจำเป็นต้องรวบรวม ใช้ และแบ่งปันข้อมูลส่วนบุคคลของคุณบางส่วน นโยบายการลาออกจากงานของผู้ขับขี่นี้มีขึ้นเพื่อช่วยให้คุณเข้าใจว่า Lalamove ดำเนินการดังกล่าวอย่างไร และจะใช้ตัวเลือกและสิทธิ์ต่างๆ ที่มีในข้อมูลของคุณหลังจากออกจากแพลตฟอร์มของเราได้อย่างไร

หากคุณร้องขอให้ลบข้อมูล Lalamove ของคุณ เราจะลบบัญชีและข้อมูลของคุณในขอบเขตที่กฎหมายที่เกี่ยวข้องกำหนด คุณสามารถร้องขอให้ลบบางส่วนหรือลบทั้งหมดก็ได้ เพื่อหลีกเลี่ยงข้อสงสัย หากคุณร้องขอให้ลบบางส่วน เราจะลบข้อมูลที่เกี่ยวข้องและจะไม่ลบข้อมูลอื่นๆ ที่ Lalamove รวบรวมไว้ ในขอบเขตที่ไม่มีเหตุผลทางกฎหมายสำหรับ Lalamove ที่จะเก็บข้อมูลที่เกี่ยวข้องไว้ นอกจากนี้ ยังไม่มีวิธีเลิกทำคำขอให้ลบบัญชีและ/หรือข้อมูลเมื่อดำเนินการเสร็จสิ้นแล้ว หากต้องการลบบัญชีและ/หรือข้อมูล Lalamove ของคุณ โปรดดูส่วน A ด้านล่าง สำหรับรายละเอียดเพิ่มเติม โปรดอ่านนโยบายความเป็นส่วนตัวของเรา

เรามุ่งมั่นที่จะตอบกลับภายใน 30 วันนับจากวันที่ได้รับคำขอของคุณ และจะแจ้งให้คุณทราบถึงสถานะคำขอของคุณ

หากกฎหมายที่เกี่ยวข้องอนุญาต เราอาจไม่สามารถลบบัญชีของคุณได้ ซึ่งอาจใช้ได้หากบัญชีของคุณมีปัญหาเกี่ยวกับความน่าเชื่อถือ ความปลอดภัย การฉ้อโกง หรือหากการปฏิบัติตามกฎหมายป้องกันไม่ให้เกิดเรื่องดังกล่าว หากต้องการทราบข้อมูลเพิ่มเติมเกี่ยวกับคำจำกัดความของพฤติกรรมที่ไม่เหมาะสมของผู้ขับขี่ โปรดไปที่หลักเกณฑ์ของชุมชนของเรา

 

A. วิธีการลบบัญชี Lalamove และ/หรือข้อมูลส่วนบุคคลของคุณ

แตะ "ลบบัญชีคนขับ" ใน "โปรไฟล์ -> การตั้งค่า -> การตั้งค่าข้อมูลส่วนบุคคล" ในแอปคนขับของเรา จากนั้นทำตามขั้นตอนด้านล่าง:

ยืนยันว่าคุณเข้าใจและยอมรับการดำเนินการของเราต่อยอดเงินคงเหลือในกระเป๋าเงินคนขับและเงินฝากคนขับของคุณ

ยืนยันตัวตนของคุณผ่าน OTP

เลือกเหตุผลในการขอลบบัญชีของคุณตามที่แสดงไว้ในแอปคนขับ

คลิก "ลบบัญชี" หลังจากอ่านข้อความฉบับเต็มตามที่แสดงไว้ในแอป เมื่อคลิกปุ่ม "ลบบัญชี" แสดงว่าคุณยอมรับการดำเนินการของเราต่อการลบบัญชีและระยะเวลาที่เกี่ยวข้อง

คลิก "ยืนยัน"

บัญชีคนขับจะถูกระงับตลอดกระบวนการลบบัญชี เว้นแต่เราจะรับทราบคำขอของคุณในการลบบัญชีของคุณและดำเนินการสำเร็จแล้ว การดำเนินการดังกล่าวอาจทำให้คุณสูญเสียการเข้าถึงข้อมูลและสิทธิประโยชน์อื่นๆ ที่คุณอาจพบว่ามีประโยชน์ในอนาคต เช่น รางวัลหรือยอดคงเหลือที่ไม่ได้ใช้ หรือข้อมูลที่อาจสนับสนุนการเรียกร้องหรือสิทธิ์ที่คุณอาจต้องการอ้างสิทธิ์

 

B. ตอนนี้ให้กู้คืนบัญชี Lalamove ที่ถูกลบไป

ขณะนี้ยังไม่มีวิธีกู้คืนบัญชีที่ถูกลบไป หากคุณต้องการเข้าร่วมแพลตฟอร์ม Lalamove อีกครั้ง คุณสามารถสร้างบัญชีใหม่ได้

 

C. ขั้นตอนในการนำสติกเกอร์ออกจากรถยนต์ของท่านและส่งคืนทรัพย์สินให้แก่ Lalamove Lalamove ขอสงวนสิทธิ์ในการขอให้นำสติกเกอร์ Lalamove ที่ติดอยู่บนรถยนต์ของท่านออกหลังจากที่ท่านเลิกใช้แพลตฟอร์มของ Lalamove แล้ว รวมทั้ง ท่านจะต้องส่งทรัพย์สินทั้งหมดของ Lalamove คืนหลังจากที่ท่านได้เลิกใช้ด้วย โดยเจ้าหน้าที่จะประสานงานและให้ความช่วยเหลือแก่ท่านเกี่ยวกับขั้นตอนการส่งคืนทรัพย์สินของ Lalamove ต่อไป

 

D. การเปลี่ยนแปลงนโยบายนี้

เราอาจอัปเดตนโยบายนี้เป็นระยะ ๆ เนื่องจากการเปลี่ยนแปลงของแพลตฟอร์ม Lalamove และกฎหมายความเป็นส่วนตัวมีการพัฒนา หากเราอัปเดต เราจะดำเนินการทางออนไลน์ และหากเราดำเนินการเปลี่ยนแปลงที่สำคัญ เราจะแจ้งให้คุณทราบผ่านแพลตฟอร์ม Lalamove หรือช่องทางการสื่อสารอื่น ๆ เช่น อีเมล เมื่อคุณใช้ Lalamove แสดงว่าคุณยอมรับข้อกำหนดล่าสุดของนโยบายนี้
