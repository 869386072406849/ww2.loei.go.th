1.บทนำ
นโยบายการใช้คุกกี้ฉบับนี้อธิบายถึงวิธีการที่ลาลามูฟ (ซึ่งต่อไปนี้เรียกว่า “เรา”) ใช้คุกกี้และเทคโนโลยีที่คล้ายคลึงกัน (รวมเรียกว่า “คุกกี้”) บนเว็บไซต์ของเรา นโยบายการใช้คุกกี้ฉบับนี้ใช้บังคับกับการใช้งานของท่านบนเว็บไซต์ของเรา ถือเป็นส่วนหนึ่งของนโยบายความเป็นส่วนตัวของเรา และควรอ่านควบคู่กับนโยบายความเป็นส่วนตัวดังกล่าว คำทั้งหมดที่ขึ้นต้นด้วยตัวอักษรพิมพ์ใหญ่ที่มีการใช้แต่ไม่ได้นิยามไว้ในที่นี้ให้มีความหมายอย่างเดียวกับที่กำหนดไว้ในนโยบายความเป็นส่วนตัว เมื่อท่านใช้งานเว็บไซต์ของเรา ถือว่าท่านได้ตกลงยอมรับการใช้คุกกี้ของเราตามนโยบายการใช้คุกกี้ฉบับนี้แล้ว หากท่านไม่เห็นด้วยกับการใช้คุกกี้ของเรา โปรดปิดการใช้งานคุกกี้บนคอมพิวเตอร์หรืออุปกรณ์อื่นๆ ของท่าน (ดูหัวข้อ “การจัดการการตั้งค่าคุกกี้ของท่าน” ที่จะได้กล่าวต่อไป)

 

2.คุกกี้คืออะไร?
คุกกี้คือไฟล์ข้อมูลขนาดเล็กที่ถูกจัดเก็บไว้ในอุปกรณ์ของท่านเมื่อท่านเข้าถึงส่วนใดส่วนหนึ่งของเว็บไซต์ของเราหรือคลิกโฆษณาออนไลน์ของเรา คุกกี้ช่วยให้เราสามารถจดจำการกระทำและการตั้งค่าของท่าน (เช่น การเข้าสู่ระบบ ภาษา ขนาดตัวอักษร และการตั้งค่าการแสดงผลอื่นๆ) ในช่วงระยะเวลาหนึ่ง เพื่อให้ท่านไม่ต้องป้อนข้อมูลซ้ำๆ เมื่อท่านกลับมาที่เว็บไซต์หรือเรียกดูจากหน้าหนึ่งไปอีกหน้าหนึ่ง

 

3. เราใช้คุกกี้อย่างไร?
เรามีความมุ่งมั่นที่จะใช้คุกกี้อย่างมีความรับผิดชอบและมีจริยธรรม โดยให้ความเคารพความเป็นส่วนตัวของผู้ใช้และความปลอดภัยของข้อมูล เราใช้ข้อมูลที่คุกกี้เก็บรวบรวมมาเพื่อ:

ทำความเข้าใจข้อมูลประชากรและพฤติกรรมของผู้ใช้: วิเคราะห์รูปแบบการใช้งานเพื่อทำความเข้าใจผู้ใช้เว็บไซต์ของเราในเชิงลึก

นำเสนอเนื้อหาเฉพาะบุคคล: จัดหาโฆษณาแบบกำหนดเป้าหมายและเนื้อหาที่เกี่ยวข้องตามความสนใจของท่านเมื่อได้รับความยิน

ปรับปรุงประสิทธิภาพด้านการตลาด: ยกระดับประสิทธิภาพของการตลาดออนไลน์และแคมเปญโฆษณาของเรา

ยกระดับประสบการณ์ของผู้ใช้: ปรับปรุงการนำทางและการทำงานของเว็บไซต์และแอปพลิเคชันของเรา

รับรองความปลอดภัยและความถูกต้องสมบูรณ์: ปกป้องแพลตฟอร์มและข้อมูลของผู้ใช้จากการเข้าถึงโดยไม่ได้รับอนุญาต

โปรดทราบว่าการปฏิเสธการใช้งานคุกกี้เพื่อปรับเนื้อหาให้เข้ากับกลุ่มเป้าหมาย/การโฆษณาของเรา ไม่ว่าจะเป็นคุกกี้ของเรา (First-Party Cookies) หรือของบุคคลที่สาม (Third-Party Cookies) มิได้หมายความว่าท่านจะไม่เห็นโฆษณาของเราเลย หากแต่โฆษณาดังกล่าวจะไม่มีการปรับแต่งให้เหมาะสมกับท่านโดยอาศัยการใช้คุกกี้ดังกล่าวเท่านั้น

คุกกี้ที่เราใช้อยู่ในปัจจุบันและข้อมูลที่เกี่ยวข้องอื่นๆ ได้แสดงไว้ดังต่อไปนี้ ทั้งนี้ โปรดทราบว่ารายการดังกล่าวนี้จะมีการปรับปรุงเป็นครั้งคราว

 

 

คุกกี้ที่มีความจำเป็นอย่างยิ่ง (Strictly Necessary Cookies)
คุกกี้ประเภทนี้มีความจำเป็นเพื่อให้เว็บไซต์และฟีเจอร์ต่างๆ ของเราทำงานได้อย่างถูกต้อง บริการที่ท่านร้องขอจะไม่สามารถจัดให้ได้หากไม่มีคุกกี้ประเภทนี้ อีกทั้งเรายังใช้คุกกี้ประเภทนี้เพื่อรักษาความปลอดภัยของแพลตฟอร์มของเราโดยการเฝ้าระวังและการแจ้งเตือนการโจมตีทางไซเบอร์และกิจกรรมการฉ้อโกงที่อาจเกิดขึ้นด้วย นอกจากนี้ คุกกี้ประเภทนี้ยังช่วยให้เราติดตามประสิทธิภาพการทำงานของเว็บไซต์ของเราเพื่อตรวจจับปัญหาทางเทคนิคและตรวจสอบการปรับปรุงและฟีเจอร์ใหม่ๆ เพื่อให้มั่นใจว่าจะไม่รบกวนการทำงานของฟังก์ชันหลักของแพลตฟอร์ม

 

