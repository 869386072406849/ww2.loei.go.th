HubSpot, Inc.

คุกกี้ที่มีความจำเป็นอย่างยิ่ง

HubSpot เป็นแพลตฟอร์ม CRM ชั้นนำที่ให้บริการซอฟต์แวร์และการสนับสนุนเพื่อช่วยให้บริษัทต่างๆ เติบโตได้ดียิ่งขึ้น แพลตฟอร์มดังกล่าวรวมถึงผลิตภัณฑ์ด้านการตลาด การขาย การบริการ การดำเนินงาน และการจัดการเว็บไซต์ ซึ่งเริ่มต้นใช้งานได้ฟรีและปรับให้สอดคล้องกับความต้องการของลูกค้าของเราในทุกขั้นตอนของการเติบโต

หากต้องการทราบเพิ่มเติมเกี่ยวกับการใช้งานคุกกี้ ทางปฏิบัติในการเก็บรวบรวมข้อมูล และวิธีการปฏิเสธคุกกี้ โปรดดูที่เว็บไซต์ของบุคคลที่สามดังกล่าว

 
4.การป้องกันการฉ้อโกง
การสร้างสมดุลระหว่างการป้องกันการฉ้อโกงและความเป็นส่วนตัวของผู้ใช้เป็นสิ่งสำคัญ เราให้ความสำคัญกับความเป็นส่วนตัวของผู้ใช้เป็นอันดับแรกเสมอ และใช้คุกกี้เฉพาะเพื่อป้องกันการฉ้อโกงและอย่างมีความรับผิดชอบและมีจริยธรรม เราอาจใช้คุกกี้เพื่อช่วยป้องกันและตรวจจับกิจกรรมฉ้อโกงบนแพลตฟอร์มของเรา โดยเรามีเป้าหมายที่จะ:

a. ปกป้องแพลตฟอร์มและผู้ใช้ของเราจากความสูญเสียทางการเงิน

b. รักษาความถูกต้องสมบูรณ์และความปลอดภัยของบริการของเรา

c. รับรองประสบการณ์ที่ปลอดภัยและเชื่อถือได้สำหรับผู้ใช้ทุกท่าน

 

5.การจัดการการตั้งค่าคุกกี้ของท่าน
การบล็อก การลบ หรือการปิดใช้งานคุกกี้

เมื่อท่านเข้าชมเว็บไซต์ของเราเป็นครั้งแรก เราจะแสดงหน้าต่างป๊อปอัพที่มีคำอธิบายเกี่ยวกับคุกกี้ ในทันทีที่ท่านคลิก “ยอมรับ" ถือว่าท่านได้ให้ความยินยอมให้เราใช้คุกกี้และปลั๊กอินทั้งหมดตามที่อธิบายไว้ในป๊อปอัพและนโยบายการใช้คุกกี้ฉบับนี้
หากท่านไม่ประสงค์จะให้ความยินยอมหรือประสงค์จะเพิกถอนความยินยอมสำหรับคุกกี้เพื่อประสิทธิภาพการทำงาน คุกกี้เพื่อการใช้งาน คุกกี้เพื่อปรับเนื้อหาให้เข้ากับกลุ่มเป้าหมาย และคุกกี้ของบุคคลที่สามไม่ว่าเมื่อใดก็ตาม ท่านสามารถเลือกบล็อก ลบ หรือปิดการใช้งานคุกกี้ได้ตามที่เบราว์เซอร์หรืออุปกรณ์ของท่านรองรับ
โปรดทราบว่าการลบหรือการปิดใช้งานคุกกี้ในอนาคตอาจส่งผลกระทบต่อประสบการณ์การใช้งานของท่าน และท่านอาจพบว่าฟีเจอร์บางอย่างบนเว็บไซต์ของเราทำงานไม่ถูกต้อง เนื่องจากท่านอาจสูญเสียข้อมูลที่บันทึกไว้บางส่วน (เช่น รายละเอียดการเข้าสู่ระบบที่บันทึกไว้ การตั้งค่าเว็บไซต์ เป็นต้น)

 

การจัดการคุกกี้เฉพาะเว็บไซต์

สำหรับการควบคุมคุกกี้เฉพาะเว็บไซต์อย่างละเอียดยิ่งขึ้น โปรดตรวจสอบที่การตั้งค่าความเป็นส่วนตัวและคุกกี้ในเบราว์เซอร์ที่ท่านเลือกใช้

 

6. สิทธิของท่าน
สิทธิของท่านเกี่ยวกับข้อมูลส่วนบุคคลของท่านได้กำหนดไว้ในนโยบายความเป็นส่วนตัวของเรา [ลิงก์ไปยังนโยบายความเป็นส่วนตัว] ในการใช้สิทธิดังกล่าว โปรดติดต่อเราโดยใช้รายละเอียดการติดต่อตามที่ระบุไว้ในหัวข้อ “ติดต่อเรา” ในนโยบายความเป็นส่วนตัว


7. การเปลี่ยนแปลงแก้ไขประกาศฉบับนี้
เราจะทบทวนและปรับปรุงนโยบายการใช้คุกกี้ฉบับนี้เป็นครั้งคราวอย่างต่อเนื่องเพื่อให้มั่นใจว่านโยบายฉบับนี้เป็นไปตามกฎระเบียบที่เกี่ยวข้องและแนวทางปฏิบัติที่ดีที่สุด การเปลี่ยนแปลงแก้ไขใดๆ จะได้รับการเผยแพร่ลงบนเว็บไซต์ของเรา สำหรับข้อมูลเพิ่มเติมเกี่ยวกับการประมวลผลข้อมูลส่วนบุคคล โปรดดูที่นโยบายความเป็นส่วนตัว [ลิงก์ไปยังนโยบายความเป็นส่วนตัว]
