นโยบายเงินประกันความปลอดภัย
 

ประกาศเงินประกันความปลอดภัย (Deposit) ของ Lalamove

เงินประกันความปลอดภัย (Deposit) มีวัตถุประสงค์เพื่อคุ้มครองสิทธิของพันธมิตรคนขับอิสระที่มุ่งมั่นร่วมกับ Lalamove ตามค่านิยมร่วมของเรา ในฐานะแพลตฟอร์มเรียกรถตามต้องการ เราให้ความยืดหยุ่นในการทำงานเพื่อให้คนขับอิสระมีรายได้ และดังนั้นเราจึงแสวงหากลุ่มคนขับอิสระที่มีส่วนร่วมในวิสัยทัศน์ของเราและสนับสนุนการขยายฐานลูกค้าด้วยความมุ่งมั่น เงินประกันยังปกป้องผลประโยชน์ร่วมกันของทั้งสองฝ่ายจากพฤติกรรมที่ไม่เหมาะสมซึ่งอาจคุกคามรายได้ของเราทั้งสอง ด้วยการปฏิบัติตามกฎพื้นฐานเหล่านี้ เราจะสร้างแพลตฟอร์มที่ปลอดภัยและน่าพึงพอใจสำหรับลูกค้าและคนขับอิสระ

 

1. การใช้เงินประกัน:

ประกาศเงินประกันความปลอดภัย (Deposit) มีวัตถุประสงค์เพื่อปกป้องผลประโยชน์ร่วมกันระหว่างคนขับอิสระและแพลตฟอร์ม

ประกาศเงินประกันความปลอดภัย (Deposit) ไม่ใช่ค่าคอมมิชชันหรือค่าธรรมเนียมสมาชิก และสามารถใช้เพื่อวัตถุประสงค์อื่นตามข้อตกลง

สัญญาเงินประกันจะเริ่มมีผลเมื่อวันที่คนขับอิสระลงนามและมีผลจนกว่าจะสิ้นสุดโดยข้อตกลงร่วมกันระหว่าง Lalamove และฝ่ายที่ลงนาม

คนขับอิสระต้องชำระเงินประกันเต็มจำนวนหลังจากการตรวจสอบ คนขับอิสระแต่ละราย (บัญชีคนขับอิสระที่ผ่านการตรวจสอบแล้ว) จะต้องส่งเงินประกันเพียงครั้งเดียวเท่านั้น

2. จำนวนเงิน:

คนขับอิสระแต่ละราย (บัญชีคนขับอิสระที่ผ่านการตรวจสอบแล้ว) จะต้องส่ง ประกาศเงินประกันความปลอดภัย (Deposit) ตามจำนวนที่กำหนดในการตรวจสอบเพียงครั้งเดียว คนขับอิสระ ควรตรวจสอบแอปพลิเคชันเพื่อดูจำนวนเงินประกันที่เป็นปัจจุบัน เนื่องจากอาจเปลี่ยนแปลงได้ตามเวลา

 

3. การคืนเงิน:

คุณมีสิทธิ์ที่จะขอคืนเงิน ประกาศเงินประกันความปลอดภัย (Deposit) หลังจากที่บัญชีคนขับอิสระของคุณสิ้นสุดลง ตามข้อกำหนดในนโยบายนี้ การดำเนินการชำระเงินจะใช้เวลา 30 วันทำการเพื่อคืนเงินเต็มจำนวน
