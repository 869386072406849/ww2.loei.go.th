นโยบายความเป็นส่วนตัวของผู้สมัครงาน
วันที่ : พฤษภาคม 2568

นโยบายความเป็นส่วนตัวนี้มีผลบังคับใช้หากคุณสมัครงานกับบริษัท ลาลามูฟ อีซี่แวน (ประเทศไทย) จำกัด “ลาลามูฟ”, “เรา”, “พวกเรา” และ “ของเรา” หมายถึงเครือบริษัทที่ทำข้อเสนอการจ้างแก่คุณเมื่อวันที่คุณได้รับเอกสารนี้ ในกรณีที่มีการใช้คำว่า “แอปพลิเคชัน” ในประกาศนี้ เรากำลังหมายความถึงใบสมัครของคุณที่ใช้ในการสมัครเพื่อทำงานที่บริษัท ลาลามูฟ อีซี่แวน (ประเทศไทย) จำกัด ประกาศความเป็นส่วนตัวฉบับนี้ (“ประกาศ”) มีผลบังคับใช้หากคุณกำลังสมัครงานกับ Lalamove เพื่อวัตถุประสงค์ของประกาศนี้ “กลุ่ม” หมายถึงบริษัท Lalamove ที่ระบุไว้ใน https://www.lalamove.com/lalamove-entities (รวมถึงสาขาและสำนักงานตัวแทน) และบริษัทสาขาและบริษัทในเครือที่เกี่ยวข้องทั่วโลก

 

เรามีความมุ่งมั่นที่จะคุ้มครองและเคารพความเป็นส่วนตัวของคุณ นโยบายนี้อธิบายว่าข้อมูลส่วนบุคคลใดที่เรารวบรวมและสร้างเกี่ยวกับคุณ เราใช้ข้อมูลนั้นเพื่ออะไร และเราให้ข้อมูลนั้นกับใคร นอกจากนี้ยังกำหนดสิทธิ์ของคุณเกี่ยวกับข้อมูลของคุณและใครที่คุณสามารถติดต่อเพื่อขอข้อมูลเพิ่มเติมหรือสอบถาม ในนโยบายนี้ ข้อมูลของคุณและข้อมูลอื่นๆที่คุณให้ไว้จะถูกตีความให้เป็น "ข้อมูลส่วนบุคคล"

 

 

A. เกี่ยวกับนโยบายฉบับนี้

เพื่อวัตถุประสงค์ของกฎหมายคุ้มครองข้อมูลส่วนบุคคล เราซึ่งถือเป็นผู้ควบคุมข้อมูล / ผู้ใช้ข้อมูลในส่วนที่เกี่ยวกับข้อมูลส่วนบุคคลของคุณ และเรามีหน้าที่รับผิดชอบในการตรวจสอบให้แน่ใจว่าเราใช้ข้อมูลส่วนบุคคลของคุณได้ถูกต้องตามกฎหมายคุ้มครองข้อมูลส่วนบุคคลที่บังคับใช้ในเขตอำนาจที่บริษัทและบริษัทในเครือว่าจ้างที่เกี่ยวข้องนั้นตั้งอยู่


 

B.ข้อมูลที่เรารวบรวมเกี่ยวกับคุณ

ภายใต้สิทธิ์ของเราในการใช้ข้อมูลส่วนบุคคลของคุณตามเหตุผลที่ระบุไว้ในหัวข้อ “การใช้ข้อมูลส่วนบุคคลของคุณ / ข้อมูลส่วนบุคคล” ด้านล่าง เราจะดำเนินการรวบรวมและประมวลผลข้อมูลส่วนบุคคลเกี่ยวกับคุณ ดังต่อไปนี้:


(a) ข้อมูลเกี่ยวกับคุณให้กับเราโดยตรง คุณอาจให้ข้อมูลส่วนบุคคลของคุณแก่เราเมื่อคุณทำการสมัครงาน. ข้อมูลส่วนบุคคลเหล่านี้อาจรวมถึง: ชื่อของคุณ, อายุ, วันเดือนปีเกิด, สัญชาติ. เลขบัตรประจำตัวประชาชน, หมายเลขประกันต่างๆที่เกี่ยวข้อง, ที่อยู่, เพศ, สถานะการสมรส, อีเมลส่วนตัวและหมายเลขโทรศัพท์, รูปภาพ, ข้อมูลเงินเดือนและเงินเดือนที่คาดหวัง, ประวัติในการทำงานและข้อมูลใดๆที่อ้างอิงรวมถึง ประวัติการศึกษา (เช่น ชื่อสถานศึกษาและภูมิลำเนา, สาขาวิชาที่ศึกษา, วุฒิการศึกษา), ประวัติการทำงาน, ตำแหน่ง, คุณสมบัติการทำงาน, ทักษะทางภาษา, เหตุผลที่คุณสมัครงานกับลาลามูฟ เป็นต้น.

 

(b) ข้อมูลส่วนบุคคลเกี่ยวกับคุณที่เราจัดเก็บ. ข้อมูลดังกล่าวอาจรวมถึงการจัดเก็บข้อมูลส่วนบุคคลที่เกี่ยวข้องกับการสมัครงานของคุณและรวมถึง:

ข้อมูลส่วนบุคคลที่เราทำการจัดเก็บผ่านทางการติดต่อสื่อสารและเอกสารจากคุณ (รวมถึงเนื้อหา,วันที่และเวลาที่คุณส่งเอกสารสมัครงาน);และ

ข้อมูลเกี่ยวกับการสัมภาษณ์งานและการประเมินของคุณ


(c) ข้อมูลที่เราได้รับจากแหล่งข้อมูลอื่นๆ เราจะทำงานร่วมกันกับหน่วยงานที่เกี่ยวข้องและอาจจะได้รับข้อมูลที่มีความเกี่ยวข้องกับคุณ เป็นต้นว่าข้อมูลส่วนบุคคลที่ได้มาขณะที่เราทำการสรรหา, การตรวจสอบข้อมูลจากบุคคลอ้างอิง ทั้งหมดนี้จะอยู่ในส่วนของใบสมัครงาน หรือ ขั้นตอนการสรรหา, ซึ่งอาจรวมถึงประวัติที่อยู่หรือภูมิลำเนาของคุณ, ประวัติเครดิตของคุณ, คุณสมบัติของคุณ (รวมทั้งสถาบันการศึกษาและคณาจารย์ที่เกี่ยวข้อง), ประวัติการเป็นกรรมการบริษัทที่คุณเคยดำรงตำแหน่งมาก่อน (ถ้ามี), ประวัติอาชญากรรมและคดีความทางแพ่ง

 

ในฐานะเจ้าของข้อมูลส่วนบุคคล คุณต้องให้ข้อมูลที่ถูกต้อง ครบถ้วน ด้วยความสัตย์จริง และให้ความร่วมมือในกรณีที่เกิดเหตุละเมิดข้อมูลส่วนบุคคล รวมทั้งต้องรับผิดชอบในการคุ้มครองข้อมูลส่วนบุคคลของคุณ นอกจากนี้ คุณยังต้องปฏิบัติตามหน้าที่ที่กฎหมายกำหนดไว้ด้วย

 

C.การใช้ข้อมูลส่วนบุคคล / ข้อมูลส่วนตัว

อาจมีความจำเป็นที่เราต้องรวบรวม,เปิดเผยและประมวลผลข้อมูลส่วนบุคคลของคุณด้วยวิธีและวัตถุประสงค์ดังต่อไปนี้


(a) เพื่อประกอบในการพิจารณาใบสมัครงานของคุณ (รวมถึงในบางกรณี เช่น เพื่อยืนยันคุณสมบัติของคุณ และอาจประมวลผลจากการตรวจสอบบุคคลอ้างอิงหรือประวัติย้อนหลังจากรายชื่อบุคคลอื่นที่เกี่ยวข้องกับคุณ)

 

(b) เพื่อวัตถุประสงค์ทางกฎหมายหรือระเบียบที่เกี่ยวข้องกับทางบริษัทฯ

 

(c) เพื่อให้เกิดความเท่าเทียมด้านโอกาสและการตรวจสอบ รวมถึง;

 

(d) เพื่อการจัดเก็บข้อมูลของคุณในกรณีมีตำแหน่งงานว่างที่เกี่ยวข้องและอาจเหมาะสมกับคุณสมบัติของคุณรวมถึงตำแหน่งงานต่างๆของบริษัทในเครือที่คุณอาจสนใจร่วมงาน ดังนั้นหากคุณไม่ต้องการให้จัดเก็บข้อมูลส่วนบุคคลของคุณเพื่อเหตุผลอื่นใดในภายภาคหน้า หรือต้องการให้เรามีการอัพเดตข่าวสารในกรณีต่างๆ, โปรดติดต่อเราผ่านช่องทาง “ติดต่อเรา”

เมื่อเรามีการใช้ข้อมูลส่วนบุคคลของคุณ เพื่อให้แน่ใจว่าการใช้งานนั้นสอดคล้องกับกฎหมายที่บังคับใช้และกฎหมายที่เกี่ยวข้องและได้รับอนุญาตและอาจกำหนดให้เราใช้ข้อมูลส่วนบุคคลด้วยเหตุผลหลายประการ เช่น:

(a) คุณได้อนุญาตและมีความประสงค์ให้เราใช้ข้อมูลส่วนบุคคลของคุณได้

 

(b) เราอาจจะใช้ข้อมูลส่วนบุคคลของคุณในกรณีขั้นตอนการติดต่อคุณ หรือ พิจารณาคุณกับตำแหน่งงานที่ทางลาลามูฟเปิดรับ

 

(c) เราอาจมีความจำเป็นใช้ข้อมูลส่วนบุคคลของคุณโดยการใช้ข้อมูลดังกล่าวจะอยู่ภายใต้กฎหมายและกฎระเบียบข้อบังคับที่เกี่ยวข้อง

 

(d) เราอาจมีความจำเป็นต้องใช้ข้อมูลส่วนบุคคลของคุณเพื่อให้เกิดประโยชน์โดยชอบด้านทางกฎหมายของเรา และเหตุผลของเราในการใช้ข้อมูลนั้นจะไม่เกินไปกว่าสิทธิของการปกป้องข้อมูลส่วนบุคคลของคุณ เช่น

เพื่อให้เราได้ประเมินศักยภาพในทักษะของคุณ, คุณสมบัติ และ/หรือ จุดเด่นหรือความโดดเด่นของใบสมัครงาน และความเหมาะสมกับตำแหน่งที่คุณสมัครงานมา

เพื่อให้เราได้ทำการตรวจสอบข้อมูลตามที่คุณได้แจ้งมา

เพื่อวัตถุประสงค์ในการบริหารจัดการและการดำเนินงานต่างๆภายในองค์กรให้มีประสิทธิภาพ

เพื่อสร้างความมั่นใจในกระบวนการสรรหาบุคคลากรของบริษัทและบริษัทภายในเครือทั่วโลก

เพื่อการรักษาแนวทางปฏิบัติตามระเบียบและนโยบายภายในองค์กร

เพื่อให้เราสามารถติดต่อคุณได้ในเรื่องการสมัครงานและขั้นตอนการสรรหาบุคคลากร

(e) ข้อมูลส่วนบุคคลของคุณจำเป็นสำหรับเราในการป้องกัน, ดำเนินคดี, หรือการเรียกร้องระหว่าง คุณ, เรา หรือบุคคลที่สาม


โปรดทราบว่าหากใบสมัครของคุณได้รับการพิจารณาและคุณได้รับการเสนอตำแหน่งงานที่เหมาะสม รวมถึงการตอบตกลงร่วมงานกับลาลามูฟ, ข้อมูลส่วนบุคคลที่เรารวบรวมระหว่างขั้นตอนการสมัครงานและกระบวนการสรรหาจะถูกบันทึกเป็นส่วนหนึ่งของประวัติการว่าจ้างของคุณ

 

D.ข้อมูลส่วนบุคคลประเภทพิเศษ

ข้อมูลส่วนบุคคลบางประเภทจัดอยู่ภายใต้การคุ้มครองหรือการจำกัดเฉพาะตามกฎหมายในบางพื้นที่ โดยที่ข้อมูลดังกล่าวเรียกว่า "หมวดหมู่ข้อมูลส่วนบุคคลประเภทพิเศษ" หรือข้อกำหนดอื่นๆ ในลักษณะที่คล้ายคลึงกัน ตัวอย่างเช่น ประวัติอาชญากรรมอาจถือเป็นข้อมูลส่วนบุคคลประเภทพิเศษภายใต้กฎหมายที่บังคับใช้ และเราอาจใช้ข้อมูลดังกล่าวสำหรับการตรวจสอบประวัติภูมิหลังของคุณ

 

ภายใต้กฎหมายที่บังคับใช้หมวดหมู่พิเศษของข้อมูลส่วนบุคคลอาจรวมถึงข้อมูลส่วนบุคคลด้านอื่นซึ่งการพิจารณาหรือดำเนินการอาจก่อให้เกิดความเสี่ยงที่สำคัญต่อสิทธิและเสรีภาพขั้นพื้นฐาน

 

เราจะดำเนินการในส่วนข้อมูลส่วนบุคคลในหมวดหมู่พิเศษของคุณก็ต่อเมื่อกฎหมายอนุญาตและเฉพาะเมื่อตรงตามเงื่อนไขข้อใดข้อหนึ่งต่อไปนี้

 

คุณได้ให้ความยินยอมอย่างชัดแจ้งแก่เราในการดำเนินงานอย่างอิสระในการประมวลผลข้อมูลส่วนบุคคลของคุณ

การพิจารณามีความจำเป็นสำหรับการปฏิบัติตามภาระหน้าที่และสิทธิเฉพาะของเราในด้านกฎหมายการจ้างงานทื่เกี่ยวข้องกับกฎหมายประกันสังคมหรือกฎหมายคุ้มครองทางสังคม(รวมถึงภาระหน้าที่เกี่ยวกับการปฏิบัติด้านสุขภาพและความปลอดภัยและความทุพพลภาพ,ความถูกต้องตามกฎหมายของบุคลากรที่ทำงานในเขตอำนาจศาลเฉพาะ ซึ่งมีความเกี่ยวข้องกับการประมวลผลข้อมูลที่เกี่ยวกับสัญชาติ,ใบอนุญาตทำงาน และวีซ่า รวมถึงการตรวจสอบความเท่าเทียมกันในการปฏิบัติต่อเชื้อชาติหรือชาติพันธุ์ และการตรวจสอบคุณสมบัติ (เมื่อจำเป็น)

การดำเนินงานมีความจำเป็นเพื่อป้องกันสุขภาพหรือความปลอดภัยของคุณในกรณีฉุกเฉิน(หรือของบุคคลอื่น)ซึ่งคุณไม่สามารถให้ความยินยอมด้วยตนเองหรือทางอื่นใดที่กฎหมายสามารถทำได้

ข้อมูลดังกล่าวเป็นข้อมูลที่คุณได้เปิดเผยต่อสาธารณะแล้ว

การประมวลผลดังกล่าวมีความจำเป็นเพื่อวัตถุประสงค์เกี่ยวกับ หรือเกี่ยวข้องกับ กระบวนพิจารณาทางกฎหมายที่เกิดขึ้นแล้วหรืออาจเกิดขึ้นในอนาคต เพื่อการขอรับคำปรึกษาทางกฎหมาย หรือเพื่อวัตถุประสงค์ในการจัดตั้ง ใช้สิทธิ หรือปกป้องสิทธิทางกฎหมาย ภายใต้กฎหมายท้องถิ่นที่บังคับใช้ หรือในกรณีที่ศาลใช้อำนาจในกระบวนการพิจารณาคดี

การประมวลผลดังกล่าวมีความจำเป็นด้วยเหตุผลด้านประโยชน์สาธารณะอย่างมีนัยสำคัญ ตามกฎหมายท้องถิ่นที่เกี่ยวข้อง ซึ่งเป็นการกระทำที่ได้สัดส่วนกับวัตถุประสงค์ที่ต้องการบรรลุ และมาพร้อมกับมาตรการคุ้มครองที่เหมาะสม หรือ

การดำเนินการดังกล่าวได้รับอนุญาตให้กระทำได้ตามกฎหมาย
E.การเปิดเผยข้อมูลส่วนบุคคลของคุณ

(a) การเปิดเผยข้อมูลภายในบริษัทในเครือ

เราอาจจะแบ่งปันข้อมูลส่วนบุคคลกับบริษัทในเครือเพื่อ:

การจัดการและการบริหารกลุ่มธุรกิจในเครือรวมถึงการบำรุงรักษาฐานข้อมูลส่วนกลางที่เก็บข้อมูลส่วนบุคคล

ช่วยให้สามารถปฏิบัติหน้าที่ต่างๆ ที่กลุ่มธุรกิจภายในเครือแต่ละกลุ่มอาจดำเนินการที่เกี่ยวข้องกับการตัดสินใจของฝ่ายทรัพยากรบุคคลระดับภูมิภาคหรือระดับโลก หรือ

การประเมินการปฏิบัติตามกฎหมาย กฎและข้อบังคับที่เกี่ยวข้องตลอดจนนโยบายและขั้นตอนภายในกลุ่มธุรกิจในเครือของเรา     

เพื่อรักษาแนวทางปฏิบัติและขั้นตอนที่สอดคล้องกับการรวบรวม,ใช้,เปิดเผย,การโอน และประมวลผลข้อมูลส่วนบุคคลทั้งบริษัทและเครือบริษัททั่วโลก แนวปฏิบัติและขั้นตอนเหล่านี้รวมถึงการบันทึก,การจัดการและการบริหารข้อมูลส่วนบุคคลเพื่อให้เป็นไปอย่างมีประสิทธิภาพ

เพื่อรักษาแนวปฏิบัติและขั้นตอนที่สอดคล้องกันเกี่ยวกับการสรรหาบุคลากรทั่วทั้งบริษัทภายในเครือ ซึ่งรวมถึงการปฏิบัติงานด้านทรัพยากรบุคคลและหน้าที่อื่นๆ ของบริษัทในเครือ
เราจะดำเนินมาตรการเพื่อให้มั่นใจว่า ข้อมูลส่วนบุคคลจะถูกเข้าถึงได้เฉพาะโดยพนักงานของเรา ซึ่งมีความจำเป็นต้องใช้ข้อมูลดังกล่าวเพื่อวัตถุประสงค์ตามที่ระบุไว้ในประกาศนี้ และพนักงานดังกล่าวจะต้องอยู่ภายใต้ข้อกำหนดด้านการรักษาความลับที่เหมาะสม และใช้ข้อมูลเฉพาะเพื่อวัตถุประสงค์ที่ระบุไว้ในประกาศนี้เท่านั้น

 

(b) การเปิดเผยข้อมูลแก่บุคคลภายนอก

เราอาจแบ่งปันข้อมูลส่วนบุคคลของคุณให้แก่บุคคลที่สามภายนอกกลุ่มบริษัทในเครือของเราในสถานการณ์ต่อไปนี้


ในขอบเขตที่กฎหมายกำหนด หากเรามีหน้าที่ต้องเปิดเผยหรือแบ่งปันข้อมูลส่วนบุคคลของคุณเพื่อปฏิบัติตามข้อกำหนดทางกฎหมาย, การจัดตั้ง, ดำเนินการหรือปกป้องสิทธิทางกฎหมายของเรา หรือเพื่อบังคับใช้หรือใช้นโยบายความเป็นส่วนตัวและข้อตกลงอื่นๆ ของเรา หรือเพื่อปกป้องสิทธิหรือทรัพย์สินของบริษัทและบริษัทในเครือของเรา ซึ่งรวมถึงการแลกเปลี่ยนข้อมูลกับบริษัทและองค์กรอื่นๆ เพื่อวัตถุประสงค์ในป้องกันการฉ้อโกงหรือการป้องกันอาชญากรรมและการลดความเสี่ยง และ

แก่ตัวแทนและผู้แทนที่เป็นบุคคลภายนอก ซึ่งผูกพันตามภาระผูกพันในการรักษาความลับ ที่เกี่ยวข้องกับการประมวลผลข้อมูลส่วนบุคคลของคุณเพื่อวัตถุประสงค์ที่อธิบายไว้ในนโยบายนี้ ซึ่งอาจรวมถึงผู้ให้บริการด้านทรัพยากรบุคคลและที่ปรึกษา การตรวจสอบประวัติและการตรวจสอบการอ้างอิง ผู้ให้บริการด้านไอทีและการสื่อสาร สำนักงานกฎหมาย นักบัญชี และผู้ตรวจสอบบัญชี

 

F. ที่ที่เราจัดเก็บข้อมูลส่วนบุคคลของคุณ / การโอนข้อมูลระหว่างประเทศ

ข้อมูลส่วนบุคคลของคุณอาจถูกโอนไประหว่างบริษัทในเครือ และไปยังบริษัทต่างๆ ภายในเครือข่ายระหว่างประเทศของเรา รวมทั้งอาจมีการเข้าถึงโดยบุคลากรที่ได้รับอนุญาตจากเรา รวมถึงในบางกรณีอาจถูกเปิดเผยให้แก่บุคคลภายนอกที่เป็นคู่สัญญาของเรา ทั้งภายนอกและภายในเขตอำนาจที่มีการเก็บรวบรวมข้อมูลครั้งแรก (“เขตอำนาจเดิม”) เพื่อวัตถุประสงค์ตามที่ระบุไว้ข้างต้น


เมื่อเรามีการโอนข้อมูลส่วนบุคคลของคุณออกจากเขตอำนาจเดิม ข้อมูลดังกล่าวจะได้รับการคุ้มครองในลักษณะเดียวกับที่เราคุ้มครองข้อมูลส่วนบุคคลของคุณภายในเขตอำนาจเดิม โดยสามารถดำเนินการได้หลายวิธี เช่น:


(a) ปลายทางที่เราส่งข้อมูลส่วนบุคคลของคุณไปนั้นได้รับการอนุมัติโดยหน่วยงานที่มีอำนาจของเขตอำนาจเดิมที่ว่ามีระดับการป้องกันที่เพียงพอ

 

(b) ผู้รับข้อมูลได้ลงนามในสัญญาตามรูปแบบมาตรฐานที่ได้รับการอนุมัติหรือแนะนำโดยหน่วยงานที่มีอำนาจของเขตอำนาจเดิม ซึ่งมีข้อผูกพันให้ผู้รับข้อมูลต้องคุ้มครองข้อมูลส่วนบุคคลของคุณ หรือ

 

(c) วิธีการอื่นที่ได้รับอนุมัติหรือแนะนำโดยหน่วยงานที่มีอำนาจของเขตอำนาจเดิม


ข้อมูลส่วนบุคคลที่เรารวบรวมจากคุณอาจถูกประมวลผลโดยบุคคลที่ปฏิบัติงานอยู่นอกเขตอำนาจที่มีการเก็บข้อมูลครั้งแรก ซึ่งบุคคลดังกล่าวอาจเป็นพนักงานของเรา หรือพนักงานของผู้ให้บริการของเรา

เราจะดำเนินการให้มั่นใจว่าการโอนข้อมูลส่วนบุคคลของคุณเป็นไปตามกฎหมายคุ้มครองข้อมูลส่วนบุคคลที่เกี่ยวข้อง


คุณสามารถขอรับรายละเอียดเพิ่มเติมเกี่ยวกับมาตรการคุ้มครองข้อมูลส่วนบุคคลของคุณเมื่อมีการโอนออกนอกเขตอำนาจที่มีการเก็บข้อมูลครั้งแรกได้ โดยติดต่อเราตามข้อมูลที่ระบุไว้ในส่วน “การติดต่อเรา” ด้านล่าง

 

G. ความปลอดภัยของข้อมูลส่วนบุคคล

เรามีการนำมาตรฐานด้านเทคโนโลยีและความปลอดภัยในการปฏิบัติงานที่เป็นที่ยอมรับโดยทั่วไปมาใช้ เพื่อปกป้องข้อมูลส่วนบุคคลของคุณจากการเข้าถึง ใช้ ประมวลผล เปลี่ยนแปลง เปิดเผย โอน ลบ หรือสูญหาย โดยไม่ได้ตั้งใจ หรือโดยไม่ได้รับอนุญาต หรือโดยไม่ชอบด้วยกฎหมาย แม้ว่าเราจะใช้มาตรการรักษาความปลอดภัยที่เหมาะสมเมื่อได้รับข้อมูลส่วนบุคคลของคุณแล้ว แต่อย่างไรก็ตาม การส่งข้อมูลผ่านทางอินเทอร์เน็ต (รวมถึงอีเมล) ไม่อาจรับประกันความปลอดภัยได้อย่างสมบูรณ์ เราจะดำเนินการอย่างเต็มความสามารถเพื่อปกป้องข้อมูลส่วนบุคคลของคุณ แต่เราไม่สามารถรับประกันความปลอดภัยของข้อมูลที่มีการส่งไปยังเราหรือส่งออกจากเราได้ ทั้งนี้ เราจะรับผิดชอบในกรณีที่เกิดข้อผิดพลาดจากระบบทางกายภาพ เทคโนโลยี หรือความผิดพลาดในการจัดการของเรา ซึ่งอาจส่งผลให้เกิดการเปิดเผยข้อมูลส่วนบุคคลโดยไม่ได้รับอนุญาตหรือเกิดการรั่วไหลของข้อมูลส่วนบุคคลของคุณ หากเกิดเหตุการณ์ละเมิดข้อมูลที่อาจส่งผลกระทบต่อความเป็นส่วนตัวหรือความปลอดภัยของข้อมูลส่วนบุคคลของคุณ เราจะแจ้งให้คุณทราบตามที่กฎหมายที่เกี่ยวข้องกำหนด

 

เราจะประเมินผลกระทบด้านความปลอดภัยของข้อมูลส่วนบุคคลอย่างสม่ำเสมอเพื่อให้สอดคล้องกับหลักการพื้นฐานสำหรับความปลอดภัยของข้อมูลส่วนบุคคล และเมื่อข้อกำหนดใหม่มีผลบังคับและมีผลผูกพันทางกฎหมาย เราจะดำเนินการตามความเหมาะสมเพื่อปกป้องข้อมูลส่วนบุคคล

 

ข้อมูลทั้งหมดที่คุณให้กับเราจะถูกจัดเก็บไว้บนเซิร์ฟเวอร์ที่มีความปลอดภัยของเรา หรือถูกจัดเก็บโดยผู้ให้บริการภายนอกที่มีความน่าเชื่อถือ หากเราได้กำหนดรหัสผ่านให้คุณ (หรือคุณเป็นผู้เลือกรหัสผ่านเอง) เพื่อใช้ในการเข้าถึงบริการบางอย่างภายในระบบไอทีของเรา คุณมีหน้าที่รับผิดชอบในการเก็บรักษารหัสผ่านดังกล่าวไว้เป็นความลับ และต้องไม่เปิดเผยให้บุคคลใดทราบ

 

 

H. ระยะเวลาการจัดเก็บ

นโยบายของเราที่จะไม่เก็บข้อมูลส่วนบุคคลไว้นานเกินความจำเป็นเพื่อให้เป็นไปตามวัตถุประสงค์ของการใช้ข้อมูล ระยะเวลาเก็บรักษาจะถูกกำหนดโดยเกณฑ์ต่อไปนี้

 

(a) วัตถุประสงค์ที่เราใช้ข้อมูลส่วนบุคคลของคุณ เราจะต้องเก็บข้อมูลไว้นานเท่าที่จำเป็นสำหรับวัตถุประสงค์นั้น และ

 

(b) ภาระผูกพันทางกฎหมาย กฎหมายหรือข้อบังคับอาจกำหนดระยะเวลาขั้นต่ำที่เราต้องเก็บข้อมูลส่วนบุคคลของคุณ

 

ในบางกรณี เราอาจเก็บข้อมูลของคุณเพื่อพิจารณาในตำแหน่งอื่นๆ และโอกาสเหมาะสมในอนาคตกับลาลามูฟ ซึ่งอาจเป็นที่สนใจของคุณ หากคุณไม่ต้องการให้เราเก็บข้อมูลของคุณอีกต่อไป หรือต้องการให้เราอัปเดตข้อมูลในขั้นตอนใดๆ โปรดติดต่อเราตามหัวข้อ "ติดต่อเรา"

 

I. สิทธิของคุณ

คุณมีสิทธิทางกฎหมายหลายประการเกี่ยวกับข้อมูลส่วนบุคคลที่เรามีเกี่ยวกับคุณ สิทธิเหล่านี้อาจแตกต่างกันไปตามเขตอำนาจศาลต่างๆ แต่มักจะรวมถึงสิ่งต่อไปนี้


(a) สิทธิ์ในการรับข้อมูลเกี่ยวกับการดำเนินการในส่วนข้อมูลส่วนบุคคลของคุณและการเข้าถึงข้อมูลส่วนบุคคลเกี่ยวกับคุณที่เราเก็บไว้;

 

(b) สิทธิในการเพิกถอนความยินยอมของคุณในการจัดเก็บข้อมูลส่วนบุคคลของคุณได้ตลอดเวลา อย่างไรก็ตาม โปรดทราบว่าเราอาจยังคงมีสิทธิในการจัดเก็บข้อมูลส่วนบุคคลของคุณ หากมีเหตุอันชอบด้วยกฎหมายอื่นๆ (นอกเหนือจากความยินยอม) ซึ่งเราใช้ในการดำเนินการดังกล่าว

 

(c) สิทธิในการขอให้เราแก้ไขข้อมูลส่วนบุคคลของคุณหากพบว่าไม่ถูกต้องหรือไม่สมบูรณ์

 

(d) สิทธิในการร้องขอให้เราลบข้อมูลส่วนบุคคลของท่านในบางกรณี โปรดทราบว่าอาจมีบางสถานการณ์ที่ท่านร้องขอให้เราลบข้อมูลส่วนบุคคลของท่าน แต่เรามีสิทธิที่จะเก็บรักษาข้อมูลดังกล่าวไว้ตามที่กฎหมายอนุญาต

 

(e) สิทธิในการคัดค้านและสิทธิในการขอให้เราจำกัดการประมวลผลข้อมูลส่วนบุคคลของคุณในบางสถานการณ์ อีกทั้ง อาจมีสถานการณ์ที่คุณคัดค้านหรือขอให้เราจำกัดการประมวลผลข้อมูลส่วนบุคคลของคุณ แต่เรามีสิทธิตามกฎหมายในการดำเนินการกับข้อมูลส่วนบุคคลของคุณต่อไป และ / หรือปฏิเสธคำขอนั้น และ

 

(f) สิทธิในการยื่นคำร้องต่อผู้ควบคุมที่มีอำนาจ เกี่ยวกับพรบ.การคุ้มครองข้อมูลส่วนบุคคล หากคุณมีข้อสงสัยว่าเราละเมิดสิทธิของคุณ

 

คุณสามารถใช้สิทธิของคุณได้ตามที่กฎหมายที่เกี่ยวข้องกำหนดได้ทุกเวลา โดยติดต่อเราตามข้อมูลที่ระบุไว้ในส่วน “การติดต่อเรา” ด้านล่าง อย่างไรก็ตาม โปรดทราบว่าอาจมีบางกรณีที่เรามีสิทธิที่จะปฏิเสธคำร้องขอของท่านตามกฎหมาย (เช่น ในกรณีที่ท่านร้องขอให้เราลบข้อมูลส่วนบุคคลของท่าน แต่เรามีหน้าที่ตามกฎหมายที่จะต้องเก็บรักษาข้อมูลดังกล่าวไว้)


ไม่มีข้อความใดในประกาศฉบับนี้ที่จะมีผลกระทบหรือจำกัดสิทธิของท่านเกี่ยวกับข้อมูลส่วนบุคคลภายใต้กฎหมายที่บังคับใช้
 

J. การแก้ไขเปลี่ยนแปลงประกาศความเป็นส่วนตัวของเรา

เราขอสงวนสิทธิในการปรับปรุงนโยบายนี้เมื่อใดก็ได้ โดยเราจะตรวจสอบให้แน่ใจว่าจะมีการอัพเดตเวอร์ชันล่าสุดโดยติดต่อเราตามที่กำหนดไว้ในนโยบายนี้


K. การติดต่อเรา

หากคุณต้องการทราบข้อมูลเพิ่มเติมเกี่ยวกับการเก็บรวบรวม,ใช้,เปิดเผย,โอนหรือประมวลผลข้อมูลส่วนบุคคลของคุณ หรือการใช้สิทธิใดๆ ที่ระบุไว้ในนโยบายนี้ โปรดติดต่อเราที่ hr.dataprivacy@lalamove.com.


L. ภาษาที่ใช้บังคับ

ประกาศฉบับนี้จัดทำขึ้นเป็นภาษาอังกฤษเป็นต้นฉบับ ในกรณีที่มีความขัดแย้ง ความแตกต่าง หรือความไม่สอดคล้องกันระหว่างฉบับภาษาอังกฤษกับฉบับแปล ให้ยึดถือฉบับภาษาอังกฤษเป็นสำคัญ ทั้งนี้ ฉบับแปลจัดทำขึ้นเพื่ออำนวยความสะดวกและให้ข้อมูลเท่านั้น
