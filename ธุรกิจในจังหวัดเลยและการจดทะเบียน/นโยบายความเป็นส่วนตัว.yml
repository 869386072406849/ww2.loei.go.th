12. ลิงก์ไปยังเว็บไซต์ของบุคคลภายนอก

12.1 ในบางโอกาส เราอาจใช้ดุลยพินิจของเราในการแสดงหรือให้ลิงก์ไปยังผลิตภัณฑ์หรือบริการของบุคคลภายนอกบนเว็บไซต์หรือแอปพลิเคชันของเรา

 

12.2 เว็บไซต์ของบุคคลภายนอกดังกล่าวมีนโยบายความเป็นส่วนตัวและเงื่อนไขการใช้งานของตนเอง ซึ่งเป็นอิสระจากเรา โดยท่านควรศึกษาและตรวจสอบเอกสารดังกล่าวก่อนใช้บริการของบุคคลภายนอกนั้น

 

12.3 เราไม่รับผิดชอบต่อเนื้อหา กิจกรรม การดำเนินงาน ผลิตภัณฑ์ หรือบริการใด ๆ ของเว็บไซต์ที่เชื่อมโยงไปยังบุคคลภายนอกดังกล่าว

 

12.4 เรามุ่งมั่นที่จะรักษาความน่าเชื่อถือและความสมบูรณ์ของเว็บไซต์และแอปพลิเคชันของเรา และยินดีรับฟังข้อเสนอแนะหรือความคิดเห็นของท่านเกี่ยวกับลิงก์ของบุคคลภายนอกดังกล่าว

 

 

13. การเปลี่ยนแปลงนโยบายความเป็นส่วนตัว

13.1 เราอาจปรับปรุงหรือแก้ไขนโยบายความเป็นส่วนตัวฉบับนี้เป็นครั้งคราว เพื่อให้สอดคล้องกับการเปลี่ยนแปลงทางกฎหมาย เทคโนโลยี หรือการดำเนินธุรกิจ เมื่อมีการปรับปรุงนโยบายความเป็นส่วนตัวฉบับนี้ เราจะดำเนินการตามมาตรการที่เหมาะสมเพื่อแจ้งให้ท่านทราบ โดยพิจารณาตามระดับความสำคัญของการเปลี่ยนแปลงดังกล่าว ในกรณีที่กฎหมายที่ใช้บังคับกำหนดให้ต้องได้รับความยินยอมสำหรับการเปลี่ยนแปลงสาระสำคัญของนโยบายความเป็นส่วนตัว เราจะขอความยินยอมจากท่านก่อนตามที่กฎหมายกำหนด ท่านสามารถตรวจสอบวันที่มีการปรับปรุงนโยบายความเป็นส่วนตัวครั้งล่าสุดได้จากวันที่ “แก้ไขล่าสุด” ที่แสดงอยู่ด้านบนของนโยบายความเป็นส่วนตัวฉบับนี้

 

13.2 ท่านควรตรวจสอบนโยบายความเป็นส่วนตัวฉบับนี้เป็นระยะ การที่ท่านยังคงใช้เว็บไซต์ แอปพลิเคชัน หรือบริการของเราต่อไปภายหลังจากมีการปรับปรุงหรือแก้ไขนโยบายความเป็นส่วนตัวฉบับนี้ จะถือว่าท่านยอมรับการเปลี่ยนแปลงหรือการปรับปรุงดังกล่าว หากท่านไม่ยอมรับการเปลี่ยนแปลงหรือการปรับปรุงนโยบายความเป็นส่วนตัวดังกล่าว เราอาจไม่สามารถให้ท่านเข้าถึงแอปพลิเคชันหรือให้บริการแก่ท่านได้

 

