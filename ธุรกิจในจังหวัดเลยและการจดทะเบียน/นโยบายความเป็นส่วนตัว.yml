

 

1. บทนำ

1.1 นโยบายความเป็นส่วนตัวฉบับนี้อธิบายถึงวิธีที่ Lalamove พร้อมด้วยบริษัทในเครือ (ซึ่งต่อไปในนโยบายนี้จะเรียกว่า “เรา” หรือ “Lalamove”) เก็บรวบรวม จัดเก็บ ประมวลผล โอนย้าย ใช้ และเปิดเผยข้อมูลส่วนบุคคลของคุณ รวมถึงสิทธิต่าง ๆ ของคุณที่เกี่ยวข้องกับการประมวลผลข้อมูลส่วนบุคคลดังกล่าว คำว่า “Lalamove” ในนโยบายความเป็นส่วนตัวฉบับนี้ หมายถึงนิติบุคคลเฉพาะรายที่ให้บริการแก่คุณ ณ วันที่คุณได้รับนโยบายความเป็นส่วนตัวฉบับนี้ คุณสามารถตรวจสอบรายชื่อนิติบุคคลทั้งหมดของ Lalamove ได้ที่ [ระบุลิงก์] และโปรดอ้างอิงภาคผนวก 1 (ข้อกำหนดเฉพาะสำหรับแต่ละเขตอำนาจศาล) สำหรับข้อกำหนดเพิ่มเติมที่อาจมีผลบังคับใช้กับคุณโดยขึ้นอยู่กับสถานที่ที่คุณพำนักอยู่

 

1.2 นโยบายความเป็นส่วนตัวฉบับนี้เกี่ยวข้องกับข้อมูลส่วนบุคคลที่เราเก็บรวบรวมเกี่ยวกับคุณ เมื่อคุณใช้งานหรือเข้าถึงเว็บแอปพลิเคชัน โมบายแอปพลิเคชัน (รวมเรียกว่า “แอปพลิเคชัน”) และเว็บไซต์ของเราที่ https://www.lalamove.com/en-th/  

 

1.3 เราดำเนินงานแอปพลิเคชันและเว็บไซต์เพื่อทำหน้าที่เป็นแพลตฟอร์มในการเชื่อมต่อผู้ใช้แพลตฟอร์มของเรากับคนขับรถ (รวมถึงบุคคลที่ใช้รูปแบบการขนส่งอื่น ๆ) และเพื่อช่วยอำนวยความสะดวกให้คนขับรถดังกล่าวสามารถให้บริการขนส่งตามความต้องการ (On-demand) ซึ่งรวมถึงแต่ไม่จำกัดเพียง การขนส่งสินค้าและการขนส่งผู้โดยสาร ตามข้อกำหนดและเงื่อนไข ข้อตกลงการใช้งาน นโยบาย กฎเกณฑ์ แนวทางปฏิบัติ และข้อกำหนดและเงื่อนไขที่เกี่ยวข้องที่ระบุไว้ในแอปพลิเคชันของเรา (เรียกว่า “บริการ”)

แอปพลิเคชันและบริการของเราได้รับการออกแบบมาสำหรับผู้ใหญ่เป็นหลัก เราจะไม่เจตนาเก็บรวบรวมข้อมูลส่วนบุคคลจากผู้เยาว์ (คือ บุคคลที่ยังอายุไม่ครบ 18 ปีบริบูรณ์ หรือยังไม่บรรลุนิติภาวะตามกฎหมายในเขตอำนาจศาลที่เกี่ยวข้อง) เว้นแต่ข้อมูลดังกล่าวจะได้รับความยินยอมล่วงหน้าจากบุคคลที่เกี่ยวข้อง (คือ บุคคลที่มีอำนาจปกครองดูแลผู้เยาว์ตามกฎหมาย)

ในกรณีที่คุณในฐานะผู้มีอำนาจปกครองดูแลได้เปิดเผยข้อมูลส่วนบุคคลของผู้เยาว์ที่อยู่ภายใต้ความดูแลของคุณให้แก่เรา คุณคือกรรมการผู้ให้ความยินยอมในการเก็บรวบรวมและประมวลผลข้อมูลส่วนบุคคลของผู้เยาว์ดังกล่าว และตกลงที่จะผูกพันตามนโยบายความเป็นส่วนตัวฉบับนี้

หากเราได้รับแจ้งว่ามีการเก็บรวบรวมข้อมูลส่วนบุคคลจากผู้เยาว์โดยไม่ได้รับความยินยอมจากผู้มีอำนาจปกครองดูแล เราจะดำเนินการลบข้อมูลส่วนบุคคลนั้นทันที

 

1.4  นโยบายความเป็นส่วนตัวฉบับนี้ใช้กับข้อมูลส่วนบุคคลของบุคคลต่อไปนี้ (รวมเรียกว่า “คุณ”):  

(A)  ผู้เยี่ยมชม (Visitors): บุคคลที่เข้าเยี่ยมชมเว็บไซต์ของเรา หรือดาวน์โหลดหรือเข้าถึงแอปพลิเคชันโดยไม่ได้เป็น "ผู้ใช้บริการ" ตามนิยามด้านล่าง  

(B)  ผู้ใช้บริการ (Users): บุคคลที่: 

(1)  ใช้ ขอรับ หรือรับบริการ;  
(2)  ติดต่อเราผ่านเว็บไซต์ แอปพลิเคชัน โทรศัพท์ หรือช่องทางการสื่อสารอื่น ๆ; 
(3)  เข้าร่วมการชิงโชคหรือการแข่งขันของเรา หรือ;  
(4)  สมัครรับข้อมูลข่าวสารหรือบล็อกของเรา

(C)  ตัวแทน (Agents): ตัวแทนของลูกค้าองค์กรหรือพันธมิตรทางธุรกิจ เช่น เจ้าของ ผู้จัดการ ผู้นำ หรือตัวแทนอื่น ๆ ของกลุ่มยานพาหนะ (Fleet) 

(D)  คนขับรถ (Drivers): บุคคลที่ให้บริการหรือยื่นใบสมัครเพื่อให้บริการผ่านแอปพลิเคชันของเรา ทั้งในนามส่วนตัวหรือผ่านบริษัทพันธมิตร ไม่ว่าจะได้รับการลงทะเบียนเป็นคนขับรถของ Lalamove สำเร็จในภายหลังหรือไม่ก็ตาม  

 

1.5  โปรดอ่านและทำความเข้าใจนโยบายความเป็นส่วนตัวฉบับนี้ก่อนเริ่มใช้งานเว็บไซต์ บริการ หรือแอปพลิเคชันของเรา 

 

2. แหล่งที่มาของข้อมูลส่วนบุคคล

2.1 เมื่อคุณเยี่ยมชมเว็บไซต์ เข้าถึง หรือใช้งานแอปพลิเคชันและบริการของเรา เราอาจขอให้คุณให้ข้อมูลส่วนบุคคลของคุณ หากคุณไม่ให้ข้อมูลที่จำเป็น เราอาจไม่สามารถจัดหาผลิตภัณฑ์หรือบริการให้แก่คุณ หรือไม่สามารถตอบข้อซักถามที่คุณมีได้ ตัวอย่างเช่น คุณอาจจะไม่สามารถเรียกใช้บริการผ่านเว็บไซต์หรือแอปพลิเคชันของเราได้ 

 

2.2 เราจะเก็บรวบรวมและประมวลผลข้อมูลส่วนบุคคลดังต่อไปนี้:

(A)  ข้อมูลที่คุณให้แก่เราโดยตรง: เช่น ระหว่างการสร้างบัญชีผู้ใช้ผ่านแอปพลิเคชันของเรา การเข้าร่วมการแข่งขัน การชิงโชค และกิจกรรมส่งเสริมการขาย การสมัครรับข้อมูลบล็อกหรือข่าวสาร หรือการส่งไฟล์หรือติดต่อสื่อสารกับเราผ่านเว็บไซต์ แอปพลิเคชัน หรือทางโทรศัพท์ ทั้งนี้ โมบายแอปพลิเคชันของเราจะขออนุญาตเข้าถึงพื้นที่จัดข้อมูล (Storage permission) เพื่อเขียนและอ่านข้อมูลในหน่วยความจำภายนอกของอุปกรณ์ เพื่อให้คุณสามารถบันทึกและอัปโหลดไฟล์และรูปภาพได้ (เช่น ใบเสร็จชำระเงิน และรูปภาพในแชท)  

(B)  ข้อมูลที่เกิดขึ้นระหว่างการใช้งานเว็บไซต์ บริการ และแอปพลิเคชันของคุณ: ตัวอย่างเช่น เราอาจเก็บรวบรวมที่อยู่ IP (IP address) และข้อมูลอุปกรณ์ของคุณ (เช่น ชื่อและรุ่นของอุปกรณ์, ระบบปฏิบัติการ, Mac address, รหัสเฉพาะประจำตัวอุปกรณ์ (IMEI, IMSI, IDFA, IDFV), หมายเลขซีเรียลของอุปกรณ์และซิมการ์ด รวมถึงการกำหนดค่าข้อมูลเครือข่ายมือถือและเครือข่ายไร้สาย) เมื่อคุณเยี่ยมชมเว็บไซต์หรือใช้งานแอปพลิเคชันของเรา  

(C)  ข้อมูลที่เราได้รับจากบุคคลที่สาม: (เช่น ตัวแทนที่เป็นบุคคลที่สาม, ผู้ใช้บริการรายอื่น, ผู้ให้บริการ และพันธมิตรทางธุรกิจของเรา) ตัวอย่างเช่น ตัวแทนที่เป็นบุคคลที่สามอาจให้ข้อมูลการตรวจสอบและประวัติเพิ่มเติมของคนขับรถ หรือผู้ใช้บริการรายอื่นอาจให้ชื่อและเบอร์โทรศัพท์ของคุณเมื่อทำการจองยานพาหนะให้คุณ หรือเมื่อเพิ่มคุณเป็นผู้ติดต่อฉุกเฉิน 

 

2.3  เราอาจเก็บรวบรวมข้อมูลส่วนบุคคลผ่านชุดพัฒนาซอฟต์แวร์ (SDKs) ที่ใช้ในการให้บริการ 

 

2.4 เราอาจเก็บรวบรวมข้อมูลส่วนบุคคลจากคนขับรถที่เข้าร่วมโปรแกรมแนะนำคนขับรถ (Driver Referral Program) และแคมเปญคนขับรถ (Driver Campaign) (รวมเรียกว่า “โปรแกรมคนขับรถ”) เท่าที่เกี่ยวข้องในการประมวลผลคำขอเข้าร่วมโปรแกรมคนขับรถดังกล่าว   

 

2.5 คุณอาจให้ข้อมูลส่วนบุคคลของบุคคลอื่นแก่เราในบางสถานการณ์ เช่น เมื่อคุณเพิ่มบุคคลเหล่านั้นเป็นผู้ติดต่อฉุกเฉิน หรือเมื่อคุณใช้งานฟีเจอร์การโทร ข้อความ และข้อความเสียงภายในแอปพลิเคชัน หากคุณให้ข้อมูลส่วนบุคคลของบุคคลอื่นแก่เรา คุณขอรับรองและรับประกันว่าคุณได้รับสิทธิ การอนุญาต และความยินยอมที่จำเป็นทั้งหมด หรือมีอำนาจตามกฎหมายในการให้ข้อมูลส่วนบุคคลดังกล่าวแก่เรา และอนุญาตให้เราเก็บรวบรวม ใช้ และเปิดเผยข้อมูลส่วนบุคคลนั้นตามที่กำหนดไว้ในนโยบายความเป็นส่วนตัวฉบับนี้   




3.  ข้อมูลส่วนบุคคลที่เราเก็บรวบรวมเกี่ยวกับคุณ 

3.1  ข้อมูลส่วนบุคคลที่เราเก็บรวบรวมเกี่ยวกับคุณประกอบด้วยข้อมูลดังต่อไปนี้:  

(A)  จากผู้เยี่ยมชม (Visitors): 

(1) ที่อยู่ IP (IP address) หรือรหัสเฉพาะประจำตัวอุปกรณ์อื่น ๆ  

(2)  ประวัติการใช้งานเว็บไซต์หรือแอปพลิเคชันของเรา 

(B)  จากผู้ใช้บริการ (Users): 

(1)  ชื่อ;

(2)  ที่อยู่อีเมล ;

(3) หมายเลขโทรศัพท์;

(4) ที่อยู่;

(5)  การติดต่อสื่อสารกับเรา; 

(6)  ที่อยู่ IP (IP address) หรือรหัสเฉพาะประจำตัวอุปกรณ์อื่น ๆ ; 

(7)  ข้อมูลการชำระเงินและข้อมูลทางธนาคาร; 

(8) ข้อมูลตำแหน่งทางภูมิศาสตร์ (Geolocation) หรือข้อมูลตำแหน่งที่ตั้ง;

(9)  ข้อมูลโปรไฟล์ผู้ใช้ รวมถึงรายละเอียดการเข้าสู่ระบบและรหัสผ่าน, รูปโปรไฟล์, เส้นทางที่บันทึกไว้, ภาษาที่ต้องการ, รายละเอียดคนขับรถคนโปรด, ความคิดเห็น, คะแนนรีวิว, คำชมเชย, รายละเอียดคำสั่งซื้อ, ประเภทบริการที่ใช้ และข้อมูลผู้แนะนำและผู้รับการแนะนำในโปรแกรมการแนะนำที่ผู้ใช้เข้าร่วม;

(10) ข้อมูลการใช้งานแอปพลิเคชันหรือข้อมูลอื่นที่เกี่ยวข้อง;

(11) รูปถ่ายของสินค้าที่จัดส่ง (ถ้ามี) 

(12) ข้อมูลส่วนบุคคลที่ผู้ใช้กรอกโดยสมัครใจในกล่องข้อความอิสระ (Free text box) เมื่อใช้บริการของเรา;

(13)   ประวัติการให้บริการที่จัดหาให้หรือเรียกใช้ ซึ่งรวมถึง (แต่ไม่จำกัดเพียง) ข้อมูลวันที่และเวลาของบริการ, ข้อมูลเส้นทาง, ระยะเวลาของการบริการ, ค่าบริการ, หมายเหตุ, การโต้ตอบผ่านการโทร ข้อความ และข้อความเสียงภายในแอปพลิเคชัน และกระบวนการทั้งหมดของบริการตามที่มีการใช้งาน 

(14) รายละเอียดผู้ติดต่อฉุกเฉิน 

(15) รูปถ่าย ภาพถ่าย และเนื้อหาทัศนูปกรณ์ (Visual content) ที่ผู้ใช้ส่งเข้ามาโดยสมัครใจผ่านแอปพลิเคชัน รวมถึงภาพสินค้า พัสดุ ยานพาหนะ หรือสิ่งของอื่น ๆ 

 

(C)  จากตัวแทน (Agents) 

(1) ชื่อ;

(2) อีเมล;

(3) ชื่อบริษัท;

(4) ตำแหน่งงาน;

(5) หมายเลขโทรศัพท์;

(6) ประเภทอุตสาหกรรมธุรกิจ; 

(7) ที่อยู่;

(8) การติดต่อสื่อสารกับเรา; 

(9) ที่อยู่ IP หรือข้อมูลระบุตัวอุปกรณ์อื่นที่เป็นเอกลักษณ์เฉพาะ; 

(10) ข้อมูลการชำระเงินและข้อมูลการธนาคาร ; 

(11)  ข้อมูลการชำระเงินและข้อมูลทางธนาคาร; 

(12) ข้อมูลระบุตำแหน่งที่ตั้งทางภูมิศาสตร์ (Geolocation) 

(13) ข้อมูลโปรไฟล์ของตัวแทน (รวมถึงรูปโปรไฟล์);

(14) ข้อมูลการใช้งานแอปพลิเคชันหรือข้อมูลส่วนบุคคลอื่น ๆ ที่เกี่ยวข้อง; 

(15)  สำเนาบัตรประจำตัวประชาชน หรือหมายเลขประจำตัวประชาชน และวันหมดอายุ 

 

(D) จากผู้ขับขี่ (Drivers)

(1) ชื่อ;

(2) หมายเลขโทรศัพท์;

(3) อีเมล;

(4) ที่อยู่ที่พักอาศัย;

(5)  การติดต่อสื่อสารกับเรา; 

(6) ที่อยู่ IP หรือข้อมูลระบุตัวอุปกรณ์อื่นที่เป็นเอกลักษณ์เฉพาะ;

(7) ข้อมูลการชำระเงินและข้อมูลทางธนาคาร;

(8) ข้อมูลตำแหน่งทางภูมิศาสตร์ (Geolocation) หรือข้อมูลตำแหน่งที่ตั้ง;

(9) ข้อมูลโปรไฟล์คนขับรถ รวมถึงรายละเอียดการเข้าสู่ระบบและรหัสผ่าน, รูปโปรไฟล์, รูปถ่ายยานพาหนะ, ภาษาที่ต้องการ, ความคิดเห็น, คะแนนรีวิว, คำชมเชย และข้อมูลผู้แนะนำและผู้รับการแนะนำในโปรแกรมการแนะนำที่คนขับรถเข้าร่วม;

(10) ข้อมูลการใช้งานแอปพลิเคชันหรือข้อมูลอื่น ๆ ที่เกี่ยวข้อง;

(11) หมายเลขใบอนุญาตขับขี่และวันหมดอายุ;

(12) ข้อมูลที่จำเป็นในการเรียกเก็บและจ่ายค่าธรรมเนียมใด ๆ ; 

(13) ข้อมูลและรูปภาพของยานพาหนะ;

(14) ข้อมูลการประกันภัยของยานพาหนะ;

(15) สำเนาบัตรประจำตัวประชาชน หมายเลขประจำตัวประชาชน วันหมดอายุของบัตร และรูปภาพบัตรประจำตัวประชาชน;

(16) ภาพใบหน้าและข้อมูลการตรวจสอบใบหน้าที่เกี่ยวข้องที่ให้ไว้ในระหว่างการตรวจสอบเริ่มต้น การตรวจสอบตามรอบระยะเวลา หรือการตรวจสอบเฉพาะกิจ และการเปิดใช้งานบัญชีอีกครั้ง;

(17) วันเดือนปีเกิด;

(18) ประวัติการให้บริการที่ท่านให้แก่ผู้อื่นหรือได้รับการร้องขอให้ท่านดำเนินการ ซึ่งรวมถึงแต่ไม่จำกัดเพียง วันที่และเวลาของการให้บริการ ข้อมูลเส้นทาง ระยะเวลาการให้บริการ ค่าบริการ หมายเหตุ การติดต่อสื่อสารผ่านฟังก์ชันการโทร ข้อความ และข้อความเสียงภายในแอปพลิเคชัน ตลอดจนข้อมูลเกี่ยวกับขั้นตอนต่าง ๆ ของการให้บริการตามที่เกี่ยวข้อง;

(19) รายละเอียดผู้ติดต่อกรณีฉุกเฉิน; และ

(20)  ข้อมูลทางกฎหมายที่จำเป็นสำหรับวัตถุประสงค์ด้านภาษีอากร เช่น หมายเลขประจำตัวผู้เสียภาษีอากร ตามที่เกี่ยวข้อง  

 

3.2  เราอาจเก็บรวบรวมและประมวลผลการบันทึกเสียงและข้อมูลที่เกี่ยวข้องเมื่อคุณใช้ฟีเจอร์ส่งข้อความเสียงภายในแอปพลิเคชันของเรา ข้อมูลดังกล่าวอาจรวมถึงเนื้อหาเสียง เสียงพื้นหลัง และข้อมูลที่ต่อเนื่องกัน เช่น บทถอดความเสียง หรือข้อมูลเมตาดาต้า (Metadata) 

 

3.3 เราจะเก็บรวบรวมเฉพาะข้อมูลส่วนบุคคลที่เราจำเป็นต้องใช้โดยสมเหตุสมผล ซึ่งเกี่ยวข้องกับวัตถุประสงค์ที่ระบุไว้ในข้อ 4 ของนโยบายความเป็นส่วนตัวฉบับนี้เท่านั้น เราจะไม่เก็บรวบรวมข้อมูลส่วนบุคคลที่ไม่จำเป็นหรือมากเกินความจำเป็น 

 

3.4 ผู้ใช้บริการมีหน้าที่รับผิดชอบในการตรวจสอบให้แน่ใจว่าเนื้อหาใด ๆ ที่อัปโหลดผ่านแอปพลิเคชันนั้นสอดคล้องกับกฎหมายที่บังคับใช้ และไม่มีข้อมูลส่วนบุคคลที่ไม่จำเป็นปะปนอยู่  

 

3.5 ในบางสถานการณ์ เราอาจประมวลผลข้อมูลตำแหน่งที่ตั้งทางภูมิศาสตร์ (Geolocation) ของคนขับรถต่อไปอีกเป็นระยะเวลาจำกัดหลังจากที่คำขอใช้บริการเสร็จสิ้นหรือถูกยกเลิก ซึ่งรวมถึงหลังจากที่เซสชันในแอปพลิเคชันได้สิ้นสุดลงแล้ว โดยกรณีนี้จะทำเท่าที่จำเป็นเพื่อวัตถุประสงค์ด้านความปลอดภัย การดำเนินงาน การปฏิบัติตามข้อกำหนด หรือวัตถุประสงค์ทางธุรกิจที่ชอบด้วยกฎหมายอื่น ๆ ตามกฎหมายที่บังคับใช้  

3.6 หากคุณเป็นผู้โดยสารของคนขับรถ คุณเข้าใจและยอมรับว่าคนขับรถบางรายอาจติดตั้งแอปพลิเคชันหรืออุปกรณ์ส่วนตัวภายในรถยนต์เพื่อวัตถุประสงค์ของตนเอง และข้อมูลส่วนบุคคลของคุณอาจถูกบันทึกไว้ในระหว่างการเดินทาง การเก็บรวบรวม การใช้ และการเปิดเผยข้อมูลส่วนบุคคลของคุณที่ได้รับจากแอปพลิเคชันหรืออุปกรณ์ส่วนตัวภายในรถยนต์ถือเป็นความรับผิดชอบของคนขับรถรายนั้น ๆ เราไม่ได้เก็บรวบรวม ใช้ ประมวลผล หรือเปิดเผยข้อมูลส่วนบุคคลดังกล่าว โปรดตรวจสอบกับคนขับรถรายดังกล่าวหากคุณมีข้อสงสัยเกี่ยวกับการใช้แอปพลิเคชันหรืออุปกรณ์ส่วนตัวภายในรถยนต์ของพวกเขา 
 
 
4. เราใช้ข้อมูลส่วนตัวของคุณอย่างไร?

4.1 เราอาจเก็บรวบรวม ประมวลผล รวบรวม และจัดทำข้อมูลส่วนบุคคลของท่านในรูปแบบดังต่อไปนี้:

(A) สำหรับผู้เยี่ยมชม (Visitors) ผู้ใช้บริการ (Users) และตัวแทน (Agents):

(1) บันทึกข้อมูลโปรไฟล์

(2) หมายเหตุ บันทึก และรายงานการใช้บริการของเรา รวมถึงแต่ไม่จำกัดเพียง บันทึกการโต้ตอบกับฝ่ายบริการลูกค้า

(3) บันทึกการชำระเงินที่เกี่ยวข้องกับบริการของเรา

(4) บันทึกและรายงานการใช้งานแอปพลิเคชันของเรา รวมถึงรายงานข้อผิดพลาด (Bug reports) กิจกรรมการแข่งขันหรือการชิงโชค และเซสชันการเข้าสู่ระบบ

(5) บันทึกประวัติการแชทสด การสื่อสารด้วยเสียง ข้อความที่ถอดความ เมตาดาต้าการโทร ความคิดเห็นและคะแนนรีวิวที่มีต่อคนขับรถ รวมถึงข้อมูลที่เกี่ยวข้องกับการยกเลิกคำสั่งซื้อ การตั้งค่าสถานะความเสี่ยง และบันทึกการสืบสวน

(B) สำหรับผู้ขับขี่ (Drivers): 

(1) บันทึกข้อมูลโปรไฟล์

(2) บันทึกและรายงานเกี่ยวกับการใช้บริการของเรา ซึ่งรวมถึงบันทึกการติดต่อสื่อสารกับฝ่ายบริการลูกค้า ทีมปฏิบัติการผู้ขับขี่ (Driver Operations) เจ้าหน้าที่ภาคสนาม และผู้ให้บริการบุคคลภายนอก;

(3) บันทึกการชำระเงินที่เกี่ยวข้องกับบริการของเรา;

(4) บันทึกและรายงานการใช้งานแอปพลิเคชันของเรา ซึ่งรวมถึงรายงานข้อผิดพลาดของระบบ การเข้าร่วมกิจกรรมการแข่งขันหรือการประกวด และประวัติการเข้าสู่ระบบ;

(5)  รายงานประวัติการแชทสด การสื่อสารด้วยเสียง และความคิดเห็นจากผู้ใช้บริการและตัวแทน;

(6) บันทึกเกี่ยวกับการให้บริการของท่านและผลการปฏิบัติงานของท่าน;

(7) บันทึกเกี่ยวกับยานพาหนะของท่าน ใบอนุญาตขับขี่ ประกันภัยยานพาหนะ และใบอนุญาตหรือเอกสารจดทะเบียนยานพาหนะ; และ

(8) ข้อมูลการยืนยันตัวตน ซึ่งใช้เพื่อยืนยันตัวตนของเจ้าของบัญชีผู้ใช้ รวมถึงเพื่อป้องกัน ตรวจจับ และต่อต้านการทุจริต การฉ้อโกง หรือพฤติกรรมที่ไม่ปลอดภัย ข้อมูลดังกล่าวมีความสำคัญต่อการรักษาความปลอดภัยและความสมบูรณ์ของแพลตฟอร์มของเรา หากท่านไม่ให้ข้อมูลดังกล่าวหรือไม่ดำเนินการตามกระบวนการยืนยันตัวตนให้เสร็จสมบูรณ์ เราอาจไม่สามารถยืนยันบัญชีผู้ใช้ของท่านได้ ซึ่งอาจส่งผลให้ท่านถูกจำกัดการเข้าถึงบริการ หรืออาจมีการใช้มาตรการรักษาความปลอดภัยอื่นที่เกี่ยวข้องกับบัญชีผู้ใช้ของท่าน

 

4.2 เราอาจประมวลผลข้อมูลส่วนบุคคลของคุณเพื่อจุดประสงค์ดังต่อไปนี้

(A) สำหรับผู้เยี่ยมชม (Visitors) ผู้ใช้บริการ (Users) และตัวแทน (Agents):

(1) เพื่อให้บริการและรักษาการให้บริการของเรา ซึ่งรวมถึง:

(i)  สร้าง อัปเดต และดูแลรักษาบัญชีที่คุณลงทะเบียนไว้กับเรา 

(ii)  ให้คำแนะนำอัตโนมัติเกี่ยวกับประเภทบริการที่เหมาะสมกับวัตถุประสงค์ของคุณและเพิ่มพูนคุณภาพบริการโดยใช้ปัญญาประดิษฐ์ (AI) 

(iii)  เปิดใช้งานระบบการขนส่งและการจัดส่ง 

(iv)  ติดตามสถานะบริการ และเสนอ ประมวลผล หรืออำนวยความสะดวกในการชำระเงินสำหรับค่าจัดส่งหรือบริการของเรา 

(2)  เพื่อตรวจสอบการใช้งานเว็บไซต์ บริการ หรือแอปพลิเคชันของเรา รวมถึงการสื่อสารที่แลกเปลี่ยนผ่านฟีเจอร์แชท การโทร ข้อความ และข้อความเสียงภายในแอปพลิเคชัน (เช่น การวินิจฉัยปัญหาของเซิร์ฟเวอร์ การติดตามโฆษณา และการวิเคราะห์พฤติกรรมผู้ใช้)  

(3)  เพื่อให้บริการฟีเจอร์และคำแนะนำที่ขับเคลื่อนด้วยระบบ AI รวมถึงการวิเคราะห์รูปภาพที่ผู้ใช้บริการอัปโหลดโดยสมัครใจเพื่อแนะนำประเภทของยานพาหนะที่เหมาะสมที่สุดสำหรับการขนส่ง นอกจากนี้ รูปภาพดังกล่าวอาจถูกนำไปประมวลผลเพื่อปรับปรุงประสิทธิภาพการดำเนินงาน เสริมสร้างประสบการณ์ของผู้ใช้ ดำเนินการวิเคราะห์ สนับสนุนกิจกรรมการวิจัยและพัฒนา ตลอดจนปรับปรุงบริการ แอปพลิเคชัน และเทคโนโลยีที่เกี่ยวข้องของเรา ทั้งนี้ การใช้งานฟีเจอร์นี้เป็นไปโดยสมัครใจอย่างสิ้นเชิง และผู้ใช้บริการยังคงสามารถสั่งซื้อบริการได้ตามปกติโดยไม่ต้องอัปโหลดรูปภาพ 

(4)  เพื่อช่วยรักษาความปลอดภัย ความมั่นคง และความถูกต้องของบริการของเรา รวมถึงการป้องกันอาชญากรรมและการฉ้อโกง: เช่น เมื่อมีการเปิดใช้งานปุ่มฉุกเฉิน หรือเมื่อมีการใช้ฟีเจอร์การโทรหรือการส่งข้อความเสียงภายในแอปพลิเคชัน 

(5)  เพื่อปรับแต่งประสบการณ์ของคุณบนแอปพลิเคชันของเราให้เป็นส่วนตัว: การระบุความชอบและพฤติกรรมของคุณช่วยให้เราเข้าใจความต้องการและความสนใจส่วนบุคคลของคุณได้ดียิ่งขึ้น และมอบบริการที่ตรงใจคุณมากขึ้น ทั้งนี้ เราอาจต้องขอความยินยอมจากคุณสำหรับกิจกรรมทางการตลาดบางประเภท ในกรณีที่ต้องได้รับความยินยอม เราจะดำเนินกิจกรรมทางการตลาดก็ต่อเมื่อได้รับความยินยอมจากคุณแล้วเท่านั้น คุณสามารถเลือกยกเลิกการรับข้อมูลข่าวสาร (Unsubscribe) ได้ตลอดเวลาหากคุณไม่ต้องการรับข้อมูลดังกล่าว 

(6)  เพื่อปรับปรุงเว็บไซต์ บริการ และแอปพลิเคชันของเรา หรือพัฒนาฟังก์ชันใหม่ ๆ เราอาจใช้ข้อมูลส่วนบุคคลของคุณเพื่อพัฒนาคุณสมบัติและฟังก์ชันการทำงานใหม่ ๆ ปรับปรุงซอฟต์แวร์และการออกแบบอินเทอร์เฟซ และเราอาจใช้รายงานข้อผิดพลาดเพื่อปรับปรุงคุณสมบัติด้านความปลอดภัย  

(7) เพื่อการให้บริการลูกค้า โดยข้อมูลส่วนบุคคลของท่านจะช่วยให้เราสามารถตอบคำถาม รับข้อเสนอแนะ และให้การสนับสนุนแก่ท่านได้อย่างมีประสิทธิภาพมากยิ่งขึ้น

(8) เพื่อการศึกษา วิจัย และพัฒนา โดยข้อมูลส่วนบุคคลของท่านอาจถูกใช้เพื่อการทดสอบ การวิจัย การวิเคราะห์ การพัฒนาผลิตภัณฑ์ และการเรียนรู้ของระบบ (Machine Learning) เพื่อปรับปรุงประสบการณ์การใช้งานของท่าน

(9) เพื่อจัดทำสถิติในภาพรวมเกี่ยวกับท่าน และเพื่อวิเคราะห์การใช้บริการและการใช้งานแอปพลิเคชันของท่าน

(10) เพื่อการสื่อสารที่ไม่ใช่การตลาดซึ่งเกี่ยวข้องกับบริการของเรา เช่น การแจ้งให้ทราบถึงการเปลี่ยนแปลงของแอปพลิเคชันหรือบริการของเรา

(11) เพื่อการบริหารจัดการธุรกิจของเรา โดยเราอาจใช้ข้อมูลส่วนบุคคลของท่านเพื่อวัตถุประสงค์ ด้านการบริหารและการดำเนินงานของธุรกิจ เช่น งานบัญชี การบริหารความเสี่ยง ความมั่นคง ปลอดภัยของข้อมูล การดำเนินงานด้านเทคโนโลยีสารสนเทศ การกำกับดูแลการปฏิบัติ ตามกฎหมาย และการจัดเก็บรักษาบันทึกข้อมูล

(12) เพื่อบันทึก ตรวจสอบ วิเคราะห์ และประมวลผลการสื่อสารที่เกิดขึ้นผ่านแอปพลิเคชันของเรา (รวมถึงการบันทึกการโทร ข้อความเสียง และข้อความ) เพื่อวัตถุประสงค์ต่าง ๆ เช่น การเฝ้าระวังด้านความปลอดภัย การตรวจจับและป้องกันการฉ้อโกง การระงับข้อพิพาท การประกันคุณภาพการให้บริการ การพัฒนาบริการ และการปฏิบัติตามกฎหมายหรือข้อกำหนดของหน่วยงานกำกับดูแล

(13) เพื่อใช้ในกระบวนการทางกฎหมาย หรือเมื่อมีความจำเป็นต้องเปิดเผยข้อมูลแก่หน่วยงานกำกับดูแล หน่วยงานของรัฐ หรือเจ้าหน้าที่ผู้มีอำนาจตามกฎหมาย หรือเพื่อการปฏิบัติตามหน้าที่ตามกฎหมายของเรา และ

(14) เพื่อการตลาดทางตรง (Direct Marketing) โดยอยู่ภายใต้เงื่อนไขว่าเราได้รับความยินยอมจากท่านตามที่กฎหมายกำหนด และตามรายละเอียดที่ระบุไว้ในข้อ 14 ของนโยบายความเป็นส่วนตัวฉบับนี้

 

(B) สำหรับผู้ขับขี่ (Drivers)

(1) เพื่อให้บริการและรักษาการให้บริการของเรา ซึ่งรวมถึง

(i) การสร้าง ปรับปรุง และดูแลรักษาบัญชีผู้ใช้ที่ท่านลงทะเบียนไว้กับเรา

(ii) การเปิดใช้งานและแจ้งเตือนเกี่ยวกับการขนส่ง คำสั่งซื้อ และการจัดส่งสินค้า

(iii) การติดตามการให้บริการ และ 

(iv) นำเสนอ ประมวลผล และอำนวยความสะดวกในการชำระเงินสำหรับการบริการ

(2) เพื่อเฝ้าติดตามการใช้งานบริการ แอปพลิเคชัน และเว็บไซต์ของเรา รวมถึงการสื่อสารที่เกิดขึ้นผ่านฟังก์ชันการสนทนา การโทร ข้อความ และข้อความเสียงภายในแอปพลิเคชัน (เช่น การวิเคราะห์และแก้ไขปัญหาที่เกิดขึ้นกับเซิร์ฟเวอร์ของเรา การติดตามผลการโฆษณา และการวิเคราะห์พฤติกรรมของผู้ใช้งาน)

(3) เพื่อช่วยรักษาความปลอดภัย ความมั่นคง และความสมบูรณ์ของบริการของเรา รวมถึงเพื่อป้องกันอาชญากรรมและการฉ้อโกง เช่น การตรวจสอบและคัดกรองผู้ขับขี่ การใช้งานปุ่มฉุกเฉิน หรือการใช้ฟังก์ชันการโทรหรือข้อความเสียงภายในแอปพลิเคชัน

(4) เพื่อยืนยันบัญชีผู้ใช้ของท่าน ตัวตนของท่าน หรือการปฏิบัติตามข้อกำหนดด้านความปลอดภัย โดยเราอาจประมวลผลรูปภาพบัตรประจำตัวประชาชน รูปโปรไฟล์ และรูปภาพที่ท่านส่งให้แก่เรา เพื่อปกป้อง บัญชีผู้ใช้ของท่าน ตัวตนของท่าน และ/หรือความปลอดภัยของชุมชนผู้ใช้งานลาลามูฟ ในบางประเทศหรือบางพื้นที่ เราอาจใช้เทคโนโลยีการจดจำใบหน้า (Facial Recognition Technology) เพื่อป้องกันการเข้าถึงบัญชีผู้ใช้ ของท่านโดยไม่ได้รับอนุญาตหรือโดยไม่ชอบด้วยกฎหมาย

(5) เพื่อปรับแต่งประสบการณ์การใช้งานแอปพลิเคชันของท่านให้เหมาะสมยิ่งขึ้น โดยการวิเคราะห์ความชอบและพฤติกรรมของท่านจะช่วยให้เราเข้าใจความต้องการและความสนใจของท่านได้ดียิ่งขึ้น และสามารถนำเสนอบริการที่เหมาะสมกับท่านมากขึ้น

สำหรับกิจกรรมทางการตลาดบางประเภท เราอาจจำเป็นต้องได้รับความยินยอมจากท่านก่อนดำเนินการ ในกรณีที่กฎหมายกำหนดให้ต้องได้รับความยินยอม เราจะดำเนินกิจกรรมดังกล่าวต่อเมื่อได้รับความยินยอมจากท่านแล้วเท่านั้น ทั้งนี้ ท่านสามารถยกเลิกการรับข้อมูลดังกล่าวได้ตลอดเวลา หากท่านไม่ประสงค์จะรับข้อมูลดังกล่าวอีกต่อไป

(6) เพื่อปรับปรุงเว็บไซต์ บริการ และแอปพลิเคชันของเรา หรือเพื่อพัฒนาบริการใหม่ ๆ โดยเราอาจใช้ข้อมูลส่วนบุคคลของท่านในการพัฒนาฟังก์ชันและคุณสมบัติใหม่ ปรับปรุงซอฟต์แวร์และการออกแบบส่วนติดต่อผู้ใช้งาน รวมถึงใช้รายงานข้อผิดพลาดของระบบเพื่อพัฒนามาตรการด้านความปลอดภัย

(7) เพื่อการให้บริการลูกค้า โดยข้อมูลส่วนบุคคลของท่านจะช่วยให้เราสามารถตอบคำถาม รับข้อเสนอแนะ และให้การสนับสนุนแก่ท่านได้อย่างมีประสิทธิภาพมากยิ่งขึ้น

(8) เพื่อการศึกษา วิจัย และพัฒนา โดยข้อมูลส่วนบุคคลของท่านอาจถูกใช้เพื่อการทดสอบ การวิจัย การวิเคราะห์ การพัฒนาผลิตภัณฑ์ และการเรียนรู้ของระบบ (Machine Learning) เพื่อปรับปรุงประสบการณ์การใช้งานของท่าน

(9) เพื่อจัดทำสถิติในภาพรวมเกี่ยวกับท่าน และเพื่อวิเคราะห์การใช้บริการ การใช้งานแอปพลิเคชัน และการจัดส่งสินค้าของท่าน รวมถึงการประเมินผลการปฏิบัติงานและตัวชี้วัดการให้บริการของผู้ขับขี่

(10) เพื่อการสื่อสารที่ไม่ใช่การตลาดซึ่งเกี่ยวข้องกับบริการของเรา เช่น การแจ้งให้ทราบถึงการเปลี่ยนแปลงของแอปพลิเคชันหรือบริการของเรา

(11) เพื่อการบริหารจัดการธุรกิจของเรา โดยเราอาจใช้ข้อมูลส่วนบุคคลของท่านเพื่อวัตถุประสงค์ด้าน การบริหารและการดำเนินงานของธุรกิจ เช่น งานบัญชี การบริหารความเสี่ยง ความมั่นคงปลอดภัยของข้อมูล การดำเนินงานด้านเทคโนโลยีสารสนเทศ การกำกับดูแลการปฏิบัติตามกฎหมาย และการจัดเก็บรักษาบันทึกข้อมูล

(12)เพื่อใช้ในกระบวนการทางกฎหมาย หรือเมื่อมีความจำเป็นต้องเปิดเผยข้อมูลแก่หน่วยงานกำกับดูแล หน่วยงานของรัฐ หรือเจ้าหน้าที่ผู้มีอำนาจตามกฎหมาย หรือเพื่อการปฏิบัติตามหน้าที่ตามกฎหมายของเรา

(13)  เพื่อการตลาดทางตรง (Direct Marketing) โดยอยู่ภายใต้เงื่อนไขว่าเราได้รับความยินยอมจากท่านตามที่กฎหมายกำหนด และตามรายละเอียดที่ระบุไว้ในข้อ 15 ของนโยบายความเป็นส่วนตัวฉบับนี้ 

(14)  เพื่อมอบสิทธิประโยชน์ต่าง ๆ ให้แก่ผู้ขับขี่ รวมถึงการซื้อประกันภัย 

(15) เพื่อประโยชน์โดยชอบด้วยกฎหมาย (Legitimate Interests) เพื่อสนับสนุนและอำนวยความสะดวกในกิจกรรมเชิงพาณิชย์ของเรา ระบุและป้องกันการกระทำที่มีเจตนาหลบเลี่ยงกลไกการจับคู่ของแพลตฟอร์ม ปรับปรุงบริการของเรา ดำเนินการวิเคราะห์ภายใน ป้องกันและสืบสวนการฉ้อโกง ตรวจสอบการปฏิบัติตามกฎของแพลตฟอร์ม และปกป้องความถูกต้องและความปลอดภัยของแพลตฟอร์ม ทั้งนี้ โดยมีเงื่อนไขว่าประโยชน์ดังกล่าวต้องไม่เกินกว่าสิทธิและเสรีภาพขั้นพื้นฐานของเจ้าของข้อมูลส่วนบุคคล  

(16) เพื่อติดตาม ตรวจสอบ และจัดทำรายงานเกี่ยวกับการใช้บริการและการใช้งานแอปพลิเคชันของท่าน เพื่อวัตถุประสงค์ในการปฏิบัติตามกฎหมายและหน้าที่ทางกฎหมายหรือข้อกำหนดของหน่วยงานกำกับดูแลที่เกี่ยวข้อง

 

4.3 หากเราประสงค์จะใช้ข้อมูลส่วนบุคคลของท่านเพื่อวัตถุประสงค์อื่นนอกเหนือจากที่ระบุไว้ในนโยบายความเป็นส่วนตัวฉบับนี้ เราจะแจ้งให้ท่านทราบล่วงหน้า และจะขอความยินยอมจากท่านก่อนในกรณีที่กฎหมายกำหนดให้ต้องได้รับความยินยอม รวมถึงจะดำเนินการให้มั่นใจว่าการใช้ข้อมูลส่วนบุคคลของท่านเป็นไปตามกฎหมายที่ใช้บังคับ

 

4.4  เราสามารถใช้ข้อมูลส่วนบุคคลของท่านตามที่ระบุไว้ข้างต้นได้ เนื่องจากมีฐานทางกฎหมายอย่างน้อยหนึ่งประการดังต่อไปนี้รองรับการประมวลผลข้อมูลส่วนบุคคลดังกล่าว 

(A) เราได้รับความยินยอมจากท่านแล้ว 

(ฺB) การประมวลผลข้อมูลดังกล่าวมีความจำเป็นเพื่อการปฏิบัติตามภาระผูกพันตามสัญญาที่เรามีกับท่าน;

(C)  เรามีหน้าที่ตามกฎหมายหรือข้อกำหนดของหน่วยงานกำกับดูแลที่ต้องปฏิบัติ; 

(D) การใช้ข้อมูลส่วนบุคคลของท่านตามที่อธิบายไว้มีความจำเป็นเพื่อประโยชน์โดยชอบด้วยกฎหมายของเรา;

(E) การประมวลผลดังกล่าวมีความจำเป็นเพื่อรับมือกับเหตุด้านสาธารณสุข หรือเพื่อคุ้มครองประโยชน์สำคัญต่อชีวิต ร่างกาย หรือสุขภาพของบุคคลธรรมดา; หรือ

(F) เรามีฐานทางกฎหมายอื่นใดที่กฎหมายที่ใช้บังคับอนุญาตให้ประมวลผลข้อมูลส่วนบุคคลของท่านได้

 

4.5 กฎหมายคุ้มครองข้อมูลส่วนบุคคลในแต่ละประเทศหรือเขตอำนาจศาลอาจมีข้อกำหนดแตกต่างกัน ดังนั้น ฐานทางกฎหมายบางประการที่ระบุไว้ในข้อ 4.4 อาจไม่สามารถนำมาใช้ได้ในทุกประเทศหรือทุกเขตอำนาจศาล (ตัวอย่างเช่น ฐานประโยชน์โดยชอบด้วยกฎหมายอาจไม่ได้รับการยอมรับให้ใช้เป็นฐานทางกฎหมายในบางประเทศ) เราจะประมวลผลข้อมูลส่วนบุคคลของท่านตามฐานทางกฎหมายที่ได้รับอนุญาตภายใต้กฎหมายที่ใช้บังคับในเขตอำนาจศาลของท่าน

 

4.6 เราจะไม่ขาย แลกเปลี่ยน แบ่งปัน โอน หรือมอบข้อมูลส่วนบุคคลของท่านที่เราเก็บรวบรวมให้แก่บุคคลภายนอกเพื่อนำไปใช้ในการตลาดทางตรงเพื่อประโยชน์ของบุคคลภายนอกนั้นเอง เว้นแต่เราได้รับความยินยอมจากท่านล่วงหน้า; หรือเรามีฐานทางกฎหมายอื่นที่กฎหมายที่ใช้บังคับอนุญาตให้ดำเนินการดังกล่าวได้

 

5. การแบ่งปันและการเปิดเผยข้อมูลส่วนบุคคล

5.1 การให้บริการของเราจำเป็นต้องมีการแบ่งปันข้อมูลส่วนบุคคลของท่านกับผู้ใช้งานรายอื่น ซึ่งรวมถึงกรณีดังต่อไปนี้

(A) การแบ่งปันชื่อ-นามสกุล หมายเลขโทรศัพท์ ข้อมูลส่วนบุคคลที่ผู้ใช้บริการหรือตัวแทนกรอกไว้โดยสมัครใจในช่องข้อความอิสระ (Free Text Box) และสถานที่รับสินค้าและสถานที่จัดส่งสินค้า ให้แก่ผู้ขับขี่ภายหลังจากที่มีการเริ่มต้นคำสั่งจัดส่งสินค้า เพื่อวัตถุประสงค์ในการดำเนินการจัดส่งสินค้าให้เสร็จสมบูรณ์;

(B) การแบ่งปันชื่อ หมายเลขโทรศัพท์ ข้อมูลโปรไฟล์ของผู้ขับขี่ ข้อมูลยานพาหนะ รูปภาพยานพาหนะ และข้อมูลตำแหน่งทางภูมิศาสตร์ (Geolocation) ของผู้ขับขี่ ให้แก่ผู้ใช้บริการหรือตัวแทนภายหลังจากที่มีการเริ่มต้นคำสั่งจัดส่งสินค้า เพื่อวัตถุประสงค์ในการดำเนินการจัดส่งสินค้าให้เสร็จสมบูรณ์;

(C) หากท่านเป็นสมาชิกของกลุ่มผู้ขับขี่ (Fleet) ข้อมูลส่วนบุคคลของท่าน (เช่น ชื่อ หมายเลขโทรศัพท์ ข้อมูลโปรไฟล์ผู้ขับขี่ บันทึกและรายงานเกี่ยวกับการใช้บริการและแอปพลิเคชันของเรา บันทึกการชำระเงิน และข้อมูลยานพาหนะ) จะถูกแบ่งปันให้แก่เจ้าของหรือผู้จัดการของกลุ่มผู้ขับขี่ดังกล่าว;

(D) การแบ่งปันข้อมูลส่วนบุคคลของผู้ใช้บริการ ซึ่งรวมถึงชื่อ หมายเลขโทรศัพท์ สถานที่รับและส่งผู้โดยสาร และข้อมูลตำแหน่งทางภูมิศาสตร์ (Geolocation) ตามความเหมาะสม ภายหลังจากที่มีการเริ่มต้นคำขอใช้บริการ เพื่อวัตถุประสงค์ในการให้บริการรับส่งผู้โดยสารให้เสร็จสมบูรณ์; และ 

(E) การแบ่งปันข้อมูลส่วนบุคคลของผู้ขับขี่ ซึ่งรวมถึงชื่อ หมายเลขโทรศัพท์ ข้อมูลโปรไฟล์ผู้ขับขี่ ข้อมูลยานพาหนะ ข้อมูลใบอนุญาตขับขี่ ข้อมูลเส้นทางการเดินทาง การให้คะแนน และข้อมูลตำแหน่งทางภูมิศาสตร์ (Geolocation) ตามความเหมาะสม ภายหลังจากที่มีการเริ่มต้นคำขอใช้บริการ เพื่อวัตถุประสงค์ในการให้บริการรับส่งผู้โดยสารให้เสร็จสมบูรณ์

 

ท่านควรใช้ความระมัดระวังเมื่อเปิดเผยข้อมูลส่วนบุคคลของท่านแก่ผู้ขับขี่ ผู้ใช้บริการ หรือตัวแทน ท่านเข้าใจและรับทราบว่าเราไม่สามารถควบคุมการกระทำของผู้ใช้งานรายอื่นซึ่งท่านเลือกที่จะแบ่งปันข้อมูลส่วนบุคคลให้ได้

 

โดยปกติแล้ว เราจะไม่ติดตามการใช้ฟังก์ชันดังกล่าวในการดำเนินธุรกิจตามปกติ อย่างไรก็ตาม เราขอสงวนสิทธิในการดำเนินการดังกล่าวตามดุลยพินิจของเรา

 

เราอาจติดตาม บันทึก และวิเคราะห์การสื่อสารที่เกิดขึ้นผ่านแอปพลิเคชันของเรา (รวมถึงการสนทนาภายในแอปพลิเคชัน การโทร ข้อความ และข้อความเสียง) ตามที่ระบุไว้ในนโยบายความเป็นส่วนตัวฉบับนี้

 

ดังนั้น ท่านเข้าใจและรับทราบว่าเราไม่สามารถและไม่ได้รับประกันว่าข้อมูลส่วนบุคคลที่ท่านแบ่งปันให้แก่ผู้ใช้งานรายอื่นจะไม่ถูกเข้าถึง ตรวจสอบ หรือรับรู้โดยบุคคลที่ไม่ได้รับอนุญาต

 

นอกจากนี้ ท่านยังรับทราบว่าข้อมูลส่วนบุคคลของท่านอาจยังคงสามารถเข้าถึงได้โดยผู้ใช้งานที่เกี่ยวข้องซึ่งท่านได้แบ่งปันข้อมูลส่วนบุคคลให้ แม้ว่าการให้บริการนั้นจะเสร็จสิ้นแล้วก็ตาม ตัวอย่างเช่น ผู้ใช้งานดังกล่าวอาจสามารถดูประวัติรายการธุรกรรมที่มีข้อมูลส่วนบุคคลของท่านปรากฏอยู่ได้

 

5.2  เราอาจแบ่งปันข้อมูลส่วนบุคคลของท่านเพื่อวัตถุประสงค์ในการให้บริการเว็บไซต์ บริการ หรือแอปพลิเคชันของเรา หรือเพื่อเหตุผลทางกฎหมาย กับบุคคลหรือหน่วยงานดังต่อไปนี้ 

(A) พนักงาน เจ้าหน้าที่ หรือที่ปรึกษาอิสระของเรา

(B) ผู้สอบบัญชี และที่ปรึกษากฎหมายและที่ปรึกษาทางการเงินภายนอกของเรา; 

(C)  ผู้ขายสินค้าและบริการ (Suppliers) พันธมิตรทางธุรกิจ ผู้ประมวลผลข้อมูลส่วนบุคคล (Data Processors) และผู้รับจ้างช่วง (Sub-contractors) ของเรา ซึ่งรวมถึง 

(i) ผู้ให้บริการด้านเทคโนโลยีสารสนเทศและซอฟต์แวร์;

(ii) ผู้ให้บริการประมวลผลและอำนวยความสะดวกด้านการชำระเงิน;

(iii) ผู้ให้บริการแพลตฟอร์มคลาวด์ (Cloud Platform Service Providers);

(iv) ผู้ให้บริการจัดเก็บข้อมูลบนคลาวด์ (Cloud Storage Providers);

(v) ผู้ให้บริการวิเคราะห์ข้อมูล (Data Analytics Providers);

(vi) พันธมิตรด้านการวิจัย;

(vii) บริษัทด้านการตลาดและโฆษณาที่จัดทำโฆษณาและกิจกรรมส่งเสริมการขายให้แก่เรา;

(viii) ผู้ให้บริการตรวจสอบประวัติและยืนยันตัวตน;

(ix) ผู้ให้บริการที่ช่วยเสริมสร้างความปลอดภัยและความมั่นคงของเว็บไซต์และแอปพลิเคชันของเรา; 

(x) ผู้ให้บริการด้านการบริการลูกค้า;

(xi) ผู้ให้บริการด้านโทรคมนาคมและบริการปกปิดหมายเลขโทรศัพท์ (Number Masking); 

(xii) ผู้ให้บริการบันทึกการโทร การถอดข้อความจากเสียง และการวิเคราะห์ข้อมูลเสียง; และ

(xiii)ผู้ให้บริการด้านการตรวจจับความเสี่ยง การป้องกันการฉ้อโกง และบริการด้านปัญญาประดิษฐ์ (Artificial Intelligence) หรือการเรียนรู้ของระบบ (Machine Learning) รวมถึงการจดจำรูปภาพ การจำแนก ประเภทวัตถุ การแนะนำยานพาหนะ และฟังก์ชันอื่น ๆ ที่ขับเคลื่อนด้วยเทคโนโลยีปัญญาประดิษฐ์ซึ่งมีให้บริการ ผ่านแอปพลิเคชัน

(D) บริษัทประกันภัย ธนาคารของเรา และบริษัทประกันภัยของผู้ขับขี่;

(E) หน่วยงานกำกับดูแล หน่วยงานของรัฐ หรือองค์กรภาครัฐใด ๆ ที่เรามีหน้าที่หรือถูกกำหนดตามกฎหมายให้เปิดเผยข้อมูลหรือจัดทำรายงานตามกฎหมายที่ใช้บังคับ;

(F) บริษัทในเครือของเรา โดยเราอาจแบ่งปันข้อมูลส่วนบุคคลกับบริษัทย่อย บริษัทแม่ และบริษัทในเครืออื่น ๆ เพื่อช่วยให้เราสามารถให้บริการของเรา หรือดำเนินการประมวลผลข้อมูลส่วนบุคคลในนามของเรา;

(G) บุคคลหรือหน่วยงานที่เกี่ยวข้อง หากเราเห็นว่าการเปิดเผยข้อมูลดังกล่าวมีความจำเป็นตามกฎหมาย กระบวนการทางกฎหมาย คำสั่งหรือคำร้องขอของหน่วยงานภาครัฐ หรือในกรณีที่การเปิดเผยข้อมูลมีความเหมาะสมด้วยเหตุผลด้านความปลอดภัย ทั้งนี้ รวมถึงการแลกเปลี่ยนข้อมูลส่วนบุคคลของท่านกับบริษัทหรือองค์กรอื่นเพื่อวัตถุประสงค์ในการป้องกันและปราบปรามอาชญากรรมและการฉ้อโกง;

(H)  เจ้าหน้าที่บังคับใช้กฎหมายหรือหน่วยงานภาครัฐที่ได้รับการกำหนดไว้ เมื่อท่านใช้งานปุ่มฉุกเฉิน; 

(I)  บุคคลภายนอกที่ได้รับการกำหนดไว้ เมื่อผู้โดยสารใช้ฟังก์ชันการแบ่งปันข้อมูลการเดินทาง; หรือ 

(J) บริษัทอื่นที่เกี่ยวข้องกับ หรืออยู่ระหว่างการเจรจาเกี่ยวกับ การควบรวมกิจการ การขายทรัพย์สินของบริษัท การรวมกิจการ การปรับโครงสร้างองค์กร การจัดหาเงินทุน หรือการเข้าซื้อกิจการทั้งหมดหรือบางส่วนของธุรกิจของเรา โดยหรือเข้าร่วมกับบริษัทดังกล่าว 

 

5.3  เราจะดำเนินการให้มั่นใจว่าบุคคลภายนอกที่ได้รับข้อมูลส่วนบุคคลของท่านตามที่ระบุไว้ในข้อ 5.2 ของนโยบายความเป็นส่วนตัวฉบับนี้ มีหน้าที่ในการรักษาความลับของข้อมูลดังกล่าว (หากมีความเกี่ยวข้องและเหมาะสม) ก่อนที่เราจะเปิดเผยหรือแบ่งปันข้อมูลส่วนบุคคลของท่านแก่บุคคลภายนอกดังกล่าว 

 

5.4 เราอาจเปิดเผยหรือแบ่งปันข้อมูลส่วนบุคคลของท่านให้แก่บุคคลอื่นนอกเหนือจากที่ระบุไว้ในข้อ 5.2 ของนโยบายความเป็นส่วนตัวฉบับนี้ได้ ในกรณีดังกล่าว เราจะแจ้งให้ท่านทราบล่วงหน้า และจะขอความยินยอมจากท่านก่อน หากกฎหมายที่ใช้บังคับกำหนดให้ต้องได้รับความยินยอม 

 

5.5 เราจะไม่ขายข้อมูลส่วนบุคคลของท่านให้แก่บุคคลภายนอก และจะรับรองว่าข้อมูลส่วนบุคคลจะถูกใช้ อย่างชอบด้วยกฎหมายและเป็นธรรม เฉพาะเท่าที่กฎหมายอนุญาตเท่านั้น

 

6. การโอนข้อมูลส่วนบุคคลไปยังต่างประเทศ

6.1 เราเป็นองค์กรที่ดำเนินธุรกิจในระดับสากล และมีการดำเนินงานอยู่ในหลายประเทศทั่วโลก ด้วยเหตุนี้ เราจึงมีการเก็บรวบรวมและโอนข้อมูลส่วนบุคคลในระดับสากล ซึ่งหมายความว่าข้อมูลส่วนบุคคลของท่านอาจถูกโอนไปยังประเทศหรือเขตเศรษฐกิจอื่นนอกเหนือจากประเทศหรือภูมิภาคที่ท่านอาศัยอยู่

เราจะดำเนินการให้มั่นใจว่าการโอนข้อมูลส่วนบุคคลดังกล่าวเป็นไปตามนโยบายความเป็นส่วนตัวฉบับนี้และเป็นไปตามกฎหมายที่ใช้บังคับ ตัวอย่างเช่น ในกรณีที่กฎหมายกำหนด เราจะดำเนินการให้มั่นใจว่าข้อมูลส่วนบุคคลที่ถูกโอนไปยังประเทศหรือภูมิภาคอื่นจะได้รับการคุ้มครองในมาตรฐานที่เทียบเท่ากับมาตรฐานที่กฎหมายที่ใช้บังคับกำหนด และหากกฎหมายกำหนด เราจะจัดให้ผู้รับข้อมูลส่วนบุคคลในต่างประเทศให้คำรับรองหรือมีมาตรการคุ้มครองข้อมูลส่วนบุคคลในระดับที่เหมาะสมเช่นเดียวกัน

6.2 หากท่านต้องการข้อมูลเพิ่มเติมเกี่ยวกับการโอนข้อมูลส่วนบุคคลไปยังต่างประเทศ โปรดติดต่อเราตามรายละเอียดที่ระบุไว้ในหัวข้อ “ติดต่อเรา” ด้านล่าง

 

7. ความมั่นคงปลอดภัยของข้อมูลส่วนตัว

7.1 เมื่อเราได้รับข้อมูลส่วนบุคคลของท่านแล้ว เราจะใช้มาตรการที่สมเหตุสมผลและสามารถปฏิบัติได้ในทางปฏิบัติ รวมถึงมาตรการรักษาความมั่นคงปลอดภัยตามที่กฎหมายที่ใช้บังคับกำหนด เพื่อให้มั่นใจว่าข้อมูลส่วนบุคคลของท่านได้รับการจัดเก็บอย่างปลอดภัย และได้รับการคุ้มครองโดยเราและผู้ประมวลผลข้อมูลส่วนบุคคลของเรา จากการเข้าถึง การประมวลผล การลบ การสูญหาย หรือการใช้งานโดยไม่ได้รับอนุญาตหรือโดยอุบัติเหตุ

 

7.2 ข้อมูลส่วนบุคคลของท่านจะถูกเก็บรักษาไว้เป็นความลับและมีความปลอดภัย เว้นแต่เพื่อวัตถุประสงค์และการใช้งานตามที่ระบุไว้ในนโยบายความเป็นส่วนตัวฉบับนี้ และจะมีการเปิดเผยข้อมูลดังกล่าวเฉพาะแก่บุคคลที่มีความจำเป็นต้องทราบข้อมูลดังกล่าวเท่านั้น

 

7.3  หากเราว่าจ้างหรือมอบหมายให้ผู้ประมวลผลข้อมูลส่วนบุคคลดำเนินการประมวลผลข้อมูลส่วนบุคคลของท่านแทนเรา เราจะใช้มาตรการทางสัญญาและมาตรการอื่นที่เหมาะสมเพื่อติดตามและตรวจสอบการปฏิบัติตามนโยบายความเป็นส่วนตัวฉบับนี้ของผู้ประมวลผลข้อมูลส่วนบุคคลดังกล่าว 

 

7.4 เราได้นำมาตรการรักษาความมั่นคงปลอดภัยในด้านองค์กร ด้านกายภาพ และด้านเทคนิค ซึ่งสอดคล้องกับมาตรฐานอุตสาหกรรมมาใช้เพื่อคุ้มครองข้อมูลส่วนบุคคลที่ท่านมอบให้แก่เรา โดยมาตรการดังกล่าวอาจรวมถึงการใช้ใบรับรองความปลอดภัยแบบ SSL (SSL Certificate) การเข้ารหัสข้อมูลด้วยโปรโตคอล TLS (TLS Encryption) และการจัดเก็บรหัสผ่านในรูปแบบที่ผ่านการแฮช (Hashed Password Storage)

 

7.5 ท่านมีหน้าที่รับผิดชอบในการรักษาความลับของรหัสผ่านสำหรับการใช้งานแอปพลิเคชันของท่าน ท่านต้องไม่เปิดเผยหรือเปิดโอกาสให้บุคคลภายนอกทราบรหัสผ่านดังกล่าวไม่ว่าในกรณีใด หากท่านเชื่อว่ารหัสผ่านหรือบัญชีผู้ใช้ของท่านถูกเปิดเผย ถูกเข้าถึงโดยไม่ได้รับอนุญาต หรืออาจถูกละเมิดความปลอดภัย โปรดแจ้งให้เราทราบโดยทันที

 

7.6 การส่งข้อมูลผ่านเครือข่ายอินเทอร์เน็ตไม่อาจรับประกันความปลอดภัยได้อย่างสมบูรณ์ แม้ว่าเราจะใช้มาตรการรักษาความมั่นคงปลอดภัยเพื่อคุ้มครองข้อมูลส่วนบุคคลของท่านแล้วก็ตาม เราไม่สามารถรับประกันความปลอดภัยของข้อมูลส่วนบุคคลที่ท่านส่งผ่านแอปพลิเคชันได้ และการส่งข้อมูลดังกล่าวถือเป็นความเสี่ยงของท่านเอง

 

8. การเก็บรักษาข้อมูลส่วนบุคคล

8.1 ข้อมูลส่วนบุคคลที่เราเก็บรวบรวมจากท่านจะไม่ถูกเก็บรักษาไว้นานเกินกว่าระยะเวลาที่จำเป็นสำหรับการดำเนินการตามวัตถุประสงค์ที่ระบุไว้ในข้อ 4 ของนโยบายความเป็นส่วนตัวฉบับนี้ เว้นแต่กฎหมายที่ใช้บังคับจะกำหนดหรืออนุญาตให้เก็บรักษาไว้เป็นระยะเวลาที่ยาวนานกว่า

 

8.2 หากบัญชีผู้ใช้ที่ท่านลงทะเบียนผ่านแอปพลิเคชันของเราไม่มีการเข้าใช้งานติดต่อกันเป็นระยะเวลาเกินสาม (3) ปี หรือในกรณีที่เราได้ปิดบัญชีผู้ใช้ของท่านตามคำขอของท่าน เราจะยังคงเก็บรักษาข้อมูลส่วนบุคคลของท่านไว้เท่าที่จำเป็นสำหรับวัตถุประสงค์ที่ระบุไว้ในข้อ 4 ของนโยบายความเป็นส่วนตัวฉบับนี้ หรือเป็นระยะเวลาที่กฎหมายที่ใช้บังคับอนุญาต

เราอาจเก็บรักษาข้อมูลส่วนบุคคลของท่านไว้เป็นระยะเวลานานกว่านั้น หากมีความจำเป็นเพื่อให้เราสามารถปฏิบัติตามภาระผูกพันตามสัญญาหรือภาระหน้าที่ตามกฎหมาย หรือในกรณีที่ท่านได้ให้ความยินยอมแก่เราในการเก็บรักษาข้อมูลส่วนบุคคลดังกล่าวต่อไป

8.3 เมื่อสิ้นสุดระยะเวลาการเก็บรักษาข้อมูล เราจะดำเนินการให้มั่นใจว่าข้อมูลส่วนบุคคลของท่าน ข้อมูลที่เกี่ยวข้องกับแอปพลิเคชันทั้งหมด และข้อมูลที่เกี่ยวข้องกับบัญชีผู้ใช้ทั้งหมด จะถูกลบหรือทำลายอย่างเหมาะสม

สำหรับเอกสารในรูปแบบกระดาษที่มีข้อมูลส่วนบุคคลของท่าน เราจะดำเนินการทำลายเอกสารดังกล่าวโดยการย่อยทำลาย (Shredding) หรือใช้วิธีการอื่นใดที่สามารถรับรองได้ว่าการทำลายเอกสารเป็นไปอย่างปลอดภัยและรักษาความลับของข้อมูลได้อย่างเหมาะสม

 

8.4 เราจะดำเนินการให้มั่นใจว่าผู้ประมวลผลข้อมูลส่วนบุคคลของเราจะเก็บรักษาข้อมูลส่วนบุคคลของท่านไว้เพียงเท่าที่จำเป็นสำหรับการดำเนินการตามวัตถุประสงค์ที่ระบุไว้ในข้อ 4 ของนโยบายความเป็นส่วนตัวฉบับนี้เท่านั้น ผู้ประมวลผลข้อมูลส่วนบุคคลของเราจะดำเนินการลบหรือทำลายข้อมูลส่วนบุคคลที่อยู่ในความครอบครองของตน เมื่อข้อมูลดังกล่าวไม่มีความจำเป็นต่อวัตถุประสงค์ที่ระบุไว้ในข้อ 4 ของนโยบายความเป็นส่วนตัวฉบับนี้อีกต่อไป เว้นแต่การลบหรือทำลายข้อมูลดังกล่าวจะถูกห้ามไว้ตามกฎหมายที่ใช้บังคับ 

 

9. สิทธิ์ของท่าน

9.1 เราเคารพสิทธิตามกฎหมายของท่านที่เกี่ยวข้องกับข้อมูลส่วนบุคคลของท่าน โดยด้านล่างนี้เป็นรายการสิทธิที่ท่านอาจมีตามกฎหมาย รวมถึงมาตรการที่เราใช้เพื่อคุ้มครองสิทธิดังกล่าว ทั้งนี้ กฎหมายคุ้มครองข้อมูลส่วนบุคคลในแต่ละประเทศหรือเขตอำนาจศาลอาจมีความแตกต่างกัน ดังนั้น สิทธิบางประการที่ระบุไว้ด้านล่างอาจไม่มีผลใช้บังคับในทุกประเทศหรือทุกเขตอำนาจศาล

(A) สิทธิในการได้รับข้อมูลเกี่ยวกับการประมวลผลข้อมูลส่วนบุคคลของท่าน และสิทธิในการเข้าถึงข้อมูลส่วนบุคคลของท่านที่เราเก็บรักษาไว้;

(B) สิทธิในการขอให้เราแก้ไขข้อมูลส่วนบุคคลของท่านให้ถูกต้อง หากข้อมูลดังกล่าวไม่ถูกต้องหรือไม่สมบูรณ์;

(C) สิทธิในการขอให้เราลบ ระงับการใช้ หรือทำให้ข้อมูลส่วนบุคคลของท่านไม่สามารถระบุตัวตนได้ (Anonymise) ในบางกรณี ทั้งนี้ โปรดทราบว่าอาจมีบางสถานการณ์ที่แม้ท่านจะร้องขอให้เราลบ ระงับการใช้ หรือทำให้ข้อมูลส่วนบุคคลของท่านไม่สามารถระบุตัวตนได้ แต่เรามีสิทธิตามกฎหมายในการเก็บรักษาข้อมูลดังกล่าวไว้ต่อไป;

(D)  ในบางกรณี สิทธิในการขอรับข้อมูลส่วนบุคคลบางประเภทในรูปแบบที่มีการจัดโครงสร้าง เป็นรูปแบบที่ใช้กันโดยทั่วไป และสามารถอ่านหรือใช้งานได้ด้วยวิธีการอัตโนมัติ (Machine-Readable Format) และ/หรือสิทธิในการขอให้เราส่งข้อมูลดังกล่าวไปยังบุคคลภายนอกในกรณีที่สามารถดำเนินการได้ในทางเทคนิค ทั้งนี้ สิทธิดังกล่าวจะใช้บังคับเฉพาะกับข้อมูลส่วนบุคคลที่ท่านได้ให้แก่เราเท่านั้น 

(E) สิทธิในการถอนความยินยอมที่ท่านได้ให้ไว้แก่เราในการประมวลผลข้อมูลส่วนบุคคลของท่าน อย่างไรก็ตาม โปรดทราบว่าเราอาจยังคงมีสิทธิประมวลผลข้อมูลส่วนบุคคลของท่านต่อไปได้ หากเรามีฐานทางกฎหมายอื่นที่ชอบด้วยกฎหมาย (นอกเหนือจากความยินยอม) รองรับการประมวลผลดังกล่าว ตัวอย่างเช่น เราอาจจำเป็นต้องเก็บรักษาข้อมูลส่วนบุคคลของท่านเพื่อปฏิบัติตามหน้าที่ตามกฎหมาย;

(F) สิทธิในการได้รับข้อมูลเกี่ยวกับทางเลือกในการไม่ให้ความยินยอม และผลกระทบที่อาจเกิดขึ้นจากการไม่ให้ความยินยอมดังกล่าว ในกรณีที่ความยินยอมเป็นฐานทางกฎหมายสำหรับการประมวลผลข้อมูลส่วนบุคคล ท่านมีสิทธิได้รับแจ้งถึงทางเลือกในการปฏิเสธการให้ความยินยอมและผลที่อาจเกิดขึ้นจากการปฏิเสธดังกล่าว;

(G) สิทธิในการคัดค้านการประมวลผลข้อมูลส่วนบุคคลของท่าน และสิทธิในการขอให้เราระงับหรือจำกัดการประมวลผลข้อมูลส่วนบุคคลของท่านในบางกรณี ทั้งนี้ อาจมีบางสถานการณ์ที่แม้ท่านจะคัดค้านหรือร้องขอให้เราจำกัดการประมวลผลข้อมูลส่วนบุคคลของท่าน แต่เรามีสิทธิตามกฎหมายที่จะดำเนินการประมวลผลข้อมูลดังกล่าวต่อไป หรือปฏิเสธคำขอดังกล่าวได้;

(H) สิทธิในการขอรับข้อมูลเกี่ยวกับประวัติการเก็บรวบรวมข้อมูลส่วนบุคคลของท่านที่เราได้ดำเนินการ;

(I) สิทธิที่จะไม่ตกอยู่ภายใต้การตัดสินใจที่มีผลต่อท่านโดยอาศัยการประมวลผลข้อมูลส่วนบุคคลด้วยวิธีการอัตโนมัติเพียงอย่างเดียว; และ

(J) สิทธิในการยื่นข้อร้องเรียนต่อหน่วยงานที่มีอำนาจ หากท่านเห็นว่าสิทธิใด ๆ ของท่านถูกละเมิดโดยเรา

 

9.2 เราจะดำเนินการใช้มาตรการทางเทคนิคที่เหมาะสมเพื่อให้ท่านสามารถควบคุมวิธีการที่เราใช้ข้อมูลส่วนบุคคลของท่านได้ นอกเหนือจากการใช้สิทธิบางประการผ่านบัญชีผู้ใช้ในแอปพลิเคชันของท่านแล้ว ท่านยังสามารถใช้สิทธิตามที่ระบุไว้ข้างต้นทั้งหมดได้โดยการติดต่อเราตามรายละเอียดที่ระบุไว้ในหัวข้อ “ติดต่อเรา” ด้านล่าง

10. มาตรการบริหารจัดการความปลอดภัยของบัญชีผู้ใช้

10.1 รหัสผ่านและความปลอดภัยของบัญชีผู้ใช้

เพื่อรักษาความปลอดภัยของบัญชีผู้ใช้ของท่านและความมั่นคงปลอดภัยโดยรวมของแพลตฟอร์ม เราอาจกำหนดให้ท่านเปลี่ยนแปลงหรือรีเซ็ตรหัสผ่านของบัญชีผู้ใช้ หรือปฏิบัติตามมาตรการตรวจสอบความปลอดภัยของบัญชีผู้ใช้อื่น ๆ ภายใต้สถานการณ์เฉพาะบางประการ โดยอาศัยเหตุผลด้านความปลอดภัยที่สมเหตุสมผล

10.2 การปรับเปลี่ยนมาตรการด้านความปลอดภัย

เราขอสงวนสิทธิในการปรับปรุง เปลี่ยนแปลง หรือแก้ไขเนื้อหาและวิธีการของมาตรการบริหารจัดการความปลอดภัยของบัญชีผู้ใช้เป็นครั้งคราว ตามรูปแบบการใช้งานบัญชีผู้ใช้ ผลการประเมินความเสี่ยง หรือข้อกำหนดทางกฎหมายที่เกี่ยวข้อง เราจะแจ้งให้ท่านทราบถึงการปรับเปลี่ยนดังกล่าวในเวลาที่เหมาะสม ผ่านนโยบายความเป็นส่วนตัวฉบับนี้ การแจ้งเตือนภายในบริการ หรือช่องทางอื่นใดที่สมเหตุสมผล

 

