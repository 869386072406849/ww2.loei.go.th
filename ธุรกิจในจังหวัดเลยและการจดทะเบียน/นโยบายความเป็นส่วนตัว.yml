ภาคผนวก 1  ข้อกำหนดเฉพาะสำหรับแต่ละเขตอำนาจตามกฎหมาย 


ประเทศไทย

 

ข้อกำหนดต่อไปนี้ใช้บังคับในกรณีที่การประมวลผลข้อมูลส่วนบุคคลอยู่ภายใต้กฎหมายของประเทศไทย ในกรณีที่ข้อกำหนดเฉพาะสำหรับประเทศไทยนี้ขัดหรือแย้งกับเนื้อหาหลักของนโยบายความเป็นส่วนตัวฉบับนี้ ให้ใช้ข้อกำหนดเฉพาะสำหรับประเทศไทยนี้บังคับเท่าที่มีความขัดหรือแย้งดังกล่าว


1. ข้อมูลส่วนบุคคลที่ให้ผ่านช่องข้อความอิสระและการติดต่อสื่อสาร

เมื่อใช้ช่องข้อความอิสระ ฟังก์ชันการสนทนา การโทร ข้อความ หรือข้อความเสียงภายในแอปพลิเคชัน ท่านควรหลีกเลี่ยงการให้ข้อมูลส่วนบุคคลที่มีความอ่อนไหว เว้นแต่การเปิดเผยข้อมูลดังกล่าวมีความจำเป็นสำหรับ บริการหรือธุรกรรมที่เกี่ยวข้อง


2. ฟังก์ชันการโทรและการสื่อสารด้วยเสียง

การโทร ข้อความเสียง และการสื่อสารด้วยเสียงอื่น ๆ ที่ดำเนินการผ่านแอปพลิเคชันอาจถูกบันทึก ถอดข้อความ ติดตาม ตรวจสอบ และวิเคราะห์ รวมถึงโดยใช้เทคโนโลยีปัญญาประดิษฐ์ การเรียนรู้ของระบบ หรือระบบอัตโนมัติอื่น เพื่อวัตถุประสงค์ต่าง ๆ ซึ่งรวมถึงการรักษาความปลอดภัยของแพลตฟอร์ม การป้องกันการฉ้อโกง การเฝ้าระวังด้านความปลอดภัย การระงับข้อพิพาท การประกันคุณภาพ การสนับสนุนลูกค้า การปรับปรุงบริการ และการปฏิบัติตามหน้าที่ตามกฎหมายและข้อกำหนดของหน่วยงานกำกับดูแลที่ใช้บังคับ ในกรณีที่กฎหมาย ที่ใช้บังคับกำหนด เราจะแจ้งข้อมูลที่เหมาะสมและขอความยินยอมก่อนดำเนินการประมวลผลที่เกี่ยวข้อง เว้นแต่ เราจะแจ้งให้ท่านทราบเป็นอย่างอื่น เราจะไม่ใช้ข้อมูลบันทึกเสียงหรือข้อมูลเสียงเพื่อระบุตัวตนหรือยืนยัน ตัวบุคคลผ่านลักษณะเฉพาะของเสียงหรือลายพิมพ์เสียง ท่านไม่ควรเปิดเผยข้อมูลส่วนบุคคลที่มีความอ่อนไหว ระหว่างการโทรหรือการสื่อสารด้วยเสียง เว้นแต่การเปิดเผยข้อมูลดังกล่าวมีความจำเป็นสำหรับบริการ หรือธุรกรรมที่เกี่ยวข้อง


3. ปัญญาประดิษฐ์และการประมวลผลอัตโนมัติ

เราอาจใช้เทคโนโลยีปัญญาประดิษฐ์ การเรียนรู้ของระบบ การวิเคราะห์ข้อมูลแบบอัตโนมัติ และเทคโนโลยีอื่น ที่มีลักษณะคล้ายคลึงกัน เพื่อสนับสนุนการให้บริการ การป้องกันการฉ้อโกง การเฝ้าระวังด้านความปลอดภัย การประเมินความเสี่ยง การสนับสนุนลูกค้า การปรับปรุงบริการ และการวิเคราะห์การดำเนินงาน ในกรณีที่กฎหมายที่ใช้บังคับอนุญาต ข้อมูลส่วนบุคคลที่ประมวลผลผ่านเทคโนโลยีดังกล่าวอาจถูกนำมาใช้ เพื่อปรับปรุงความถูกต้อง ความน่าเชื่อถือ และประสิทธิภาพของระบบและบริการของเรา การประมวลผลดังกล่าว จะดำเนินการตามกฎหมายคุ้มครองข้อมูลส่วนบุคคลที่ใช้บังคับและมาตรการคุ้มครองที่เหมาะสม ในกรณีที่มีการตัดสินใจซึ่งก่อให้เกิดผลทางกฎหมายหรือผลกระทบสำคัญในลักษณะเดียวกันต่อท่านโดยอาศัยการประมวลผลอัตโนมัติเพียงอย่างเดียว เราจะให้ข้อมูลและจัดให้มีมาตรการคุ้มครองตามที่กฎหมายที่ใช้บังคับกำหนด


4. ข้อมูลตำแหน่งที่ตั้งทางภูมิศาสตร์ 

เพื่อความปลอดภัยของแพลตฟอร์ม ป้องกันการฉ้อโกง ระงับข้อพิพาท และบังคับใช้ข้อกำหนดการให้บริการของเรา เราอาจเก็บรวบรวมและประมวลผลข้อมูลตำแหน่งที่ตั้งที่แม่นยำของคุณ (GPS) เมื่อคุณใช้งานแอปพลิเคชัน โปรดทราบว่าสิ่งนี้รวมถึงการเก็บรวบรวมข้อมูลตำแหน่งของคุณในขณะที่แอปพลิเคชันกำลังทำงานในพื้นหลัง (Background) หรือในช่วงเวลาที่จำกัดและจำเป็นอย่างเข้มงวด การประมวลผลนี้อิงตามฐานประโยชน์โดยชอบด้วยกฎหมายของเราเป็นหลักในการป้องกันการฉ้อโกงและความปลอดภัยของแพลตฟอร์ม เราตรวจสอบให้แน่ใจว่าการประมวลผลดังกล่าวไม่เกินกว่าสิทธิและเสรีภาพขั้นพื้นฐานของคุณภายใต้กฎหมายคุ้มครองข้อมูลส่วนบุคคลที่บังคับใช้  

5. สิทธิของเจ้าของข้อมูลส่วนบุคคลในประเทศไทย

นอกเหนือจากสิทธิที่ระบุไว้ในข้อ 9 ของนโยบายความเป็นส่วนตัวฉบับนี้ และภายใต้เงื่อนไข ข้อจำกัด และข้อยกเว้นที่กฎหมายที่ใช้บังคับกำหนด ท่านอาจมีสิทธิเกี่ยวกับข้อมูลส่วนบุคคลของท่านดังต่อไปนี้:

(A) สิทธิในการขอเข้าถึงและขอรับสำเนาข้อมูลส่วนบุคคลของท่านที่เราเก็บรักษาไว้ และขอให้เปิดเผยถึงการได้มา ซึ่งข้อมูลส่วนบุคคลที่เราได้รับมาโดยไม่ได้รับความยินยอมจากท่าน;

(B) สิทธิในการขอให้แก้ไขข้อมูลส่วนบุคคลที่ไม่ถูกต้อง ไม่ครบถ้วน ไม่เป็นปัจจุบัน หรืออาจก่อให้เกิดความเข้าใจผิด ให้ถูกต้อง เป็นปัจจุบัน ครบถ้วน และไม่ก่อให้เกิดความเข้าใจผิด;

(C) สิทธิในการขอให้ลบ ทำลาย หรือทำให้ข้อมูลส่วนบุคคลของท่านไม่สามารถระบุตัวบุคคลได้ ในกรณีดังต่อไปนี้:

(1) ข้อมูลส่วนบุคคลไม่มีความจำเป็นต่อวัตถุประสงค์ที่ได้เก็บรวบรวม ใช้ หรือเปิดเผยอีกต่อไป;

(2) ท่านได้ถอนความยินยอมซึ่งเป็นฐานในการเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูล และเราไม่มีฐาน ทางกฎหมายอื่นในการประมวลผลข้อมูลดังกล่าวต่อไป;

(3) ท่านได้คัดค้านการเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลโดยชอบด้วยกฎหมาย และเรา ไม่สามารถปฏิเสธคำขอดังกล่าวได้ตามกฎหมายที่ใช้บังคับ; หรือ

(4) ข้อมูลส่วนบุคคลได้ถูกเก็บรวบรวม ใช้ หรือเปิดเผยโดยไม่ชอบด้วยกฎหมาย;

(D) ในกรณีที่ใช้บังคับ สิทธิในการขอรับข้อมูลส่วนบุคคลเกี่ยวกับท่านในรูปแบบที่มีการจัดโครงสร้าง ใช้กันโดยทั่วไป และสามารถอ่านได้ด้วยเครื่องมือหรืออุปกรณ์อัตโนมัติ และขอให้ส่งหรือโอนข้อมูลส่วนบุคคลดังกล่าวไปยัง ผู้ควบคุมข้อมูลส่วนบุคคลรายอื่น ในกรณีที่สามารถดำเนินการได้ด้วยวิธีการทางเทคนิค;

(E) สิทธิในการคัดค้านการเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลของท่านในกรณีที่กฎหมายที่ใช้บังคับอนุญาต;

(F) สิทธิในการขอให้ระงับการใช้ข้อมูลส่วนบุคคลของท่านในกรณีที่กฎหมายที่ใช้บังคับอนุญาต;

(G) สิทธิในการถอนความยินยอมได้ตลอดเวลา ในกรณีที่ความยินยอมเป็นฐานทางกฎหมายในการประมวลผล โดยการถอนความยินยอมจะไม่กระทบต่อความชอบด้วยกฎหมายของการประมวลผลที่ได้ดำเนินการก่อนการถอน ความยินยอม; และ

(H) สิทธิในการยื่นข้อร้องเรียนต่อหน่วยงานกำกับดูแลด้านการคุ้มครองข้อมูลส่วนบุคคลที่มีอำนาจในประเทศไทย หากท่านเห็นว่าการเก็บรวบรวม ใช้ หรือเปิดเผยข้อมูลส่วนบุคคลของท่านไม่เป็นไปตามกฎหมายที่ใช้บังคับ

การใช้สิทธิดังกล่าวอยู่ภายใต้ข้อกำหนด เงื่อนไข ข้อจำกัด และข้อยกเว้นที่กฎหมายที่ใช้บังคับกำหนด เราอาจปฏิเสธหรือจำกัดคำขอได้ในกรณีที่กฎหมายอนุญาตหรือกำหนด และจะแจ้งเหตุผลของการปฏิเสธหรือ จำกัดดังกล่าวแก่ท่านในกรณีที่กฎหมายกำหนด ท่านสามารถใช้สิทธิของท่านโดยติดต่อเราตามรายละเอียด ที่ระบุไว้ในส่วน “ติดต่อเรา” ของนโยบายความเป็นส่วนตัวฉบับนี้


6. การโอนข้อมูลส่วนบุคคลไปยังต่างประเทศ

ข้อมูลส่วนบุคคลของท่านอาจถูกโอนไป จัดเก็บ หรือเข้าถึงจากสถานที่นอกประเทศไทย รวมถึงเขตบริหารพิเศษฮ่องกง ประเทศสิงคโปร์ สาธารณรัฐประชาชนจีน ประเทศมาเลเซีย และเขตอำนาจศาลอื่นที่บริษัทในเครือ พันธมิตร หรือผู้ให้บริการของเราดำเนินงานอยู่ ในกรณีที่มีการโอนข้อมูลส่วนบุคคลออกนอกประเทศไทย เราจะจัดให้ มีมาตรการคุ้มครองและกลไกการโอนข้อมูลตามที่กฎหมายที่ใช้บังคับกำหนด ซึ่งอาจรวมถึงการโอนข้อมูลส่วนบุคคล ไปยังประเทศหรือเขตอำนาจศาลที่มีมาตรฐานการคุ้มครองข้อมูลส่วนบุคคลที่เพียงพอ การจัดให้มีมาตรการคุ้มครอง ตามสัญญาที่เหมาะสม การอาศัยข้อยกเว้นตามกฎหมายที่ใช้บังคับ หรือการใช้มาตรการอื่นที่กฎหมายคุ้มครอง ข้อมูลส่วนบุคคลที่เกี่ยวข้องรับรอง

7. การตลาดทางตรง

เราอาจใช้ข้อมูลส่วนบุคคลของท่านเพื่อการตลาดทางตรงเฉพาะในกรณีที่กฎหมายที่ใช้บังคับอนุญาต และจะขอความยินยอมจากท่านก่อนในกรณีที่กฎหมายกำหนด

บริการ ผลิตภัณฑ์ และเรื่องที่อาจทำการตลาดแก่ท่าน ได้แก่:

(1) บริการจัดส่งสินค้าแบบตามความต้องการ บริการรับซื้อสินค้า และบริการหรือผลิตภัณฑ์ที่เกี่ยวข้อง;

(2) โปรแกรมสะสมคะแนน โปรแกรมสมาชิก โปรแกรมสิทธิประโยชน์ และบริการหรือผลิตภัณฑ์ที่เกี่ยวข้อง;

(3) บริการและผลิตภัณฑ์ที่นำเสนอโดยลาลามูฟ นิติบุคคลอื่นในกลุ่มลาลามูฟ หรือพันธมิตรด้านการตลาดร่วมและพันธมิตรทางธุรกิจของเรา; และ

(4) การบริจาคและการสนับสนุนเพื่อวัตถุประสงค์ด้านการกุศลหรือองค์กรที่ไม่แสวงหากำไร

ท่านสามารถถอนความยินยอมในการทำการตลาดทางตรง หรือขอให้เราหยุดใช้ข้อมูลส่วนบุคคลของท่านเพื่อ การตลาดทางตรงได้ตลอดเวลาผ่านช่องทางที่ระบุไว้ในข้อ 15.4 ของนโยบายความเป็นส่วนตัวฉบับนี้


8. เจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล

บริษัทได้แต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลเพื่อให้คำแนะนำ ตรวจสอบการปฏิบัติตามกฎหมายคุ้มครอง ข้อมูลส่วนบุคคลที่ใช้บังคับ และทำหน้าที่เป็นช่องทางติดต่อสำหรับข้อซักถาม คำขอ หรือข้อร้องเรียนที่เกี่ยวข้อง กับข้อมูลส่วนบุคคล


